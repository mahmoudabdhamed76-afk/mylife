<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0B2F27">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="My Life">
<title>My Life — متابعة صحتك اليومية</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zain:wght@400;700;800;900&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#10261F;
  --deep:#0B2F27;
  --ink-2:#1D4437;
  --on-deep:#FFFFFF;
  --paper:#E3ECE7;
  --surface:#F4F9F6;
  --line:#D2DFD8;
  --muted:#658074;
  --teal:#0E9E6B;
  --teal-d:#07684A;
  --teal-l:#DCF2E7;
  /* ألوان الأقسام */
  --c-glucose:#0D9488;  --c-glucose-l:#DAF0EE;
  --c-a1c:#7A5AF8;      --c-a1c-l:#ECE8FE;
  --c-weight:#2563EB;   --c-weight-l:#E2EAFD;
  --c-meal:#E07B21;     --c-meal-l:#FCEDDD;
  --c-water:#0EA5E9;    --c-water-l:#DFF1FC;
  --c-run:#5CA808;      --c-run-l:#EAF4D9;
  --c-bp:#E11D64;       --c-bp-l:#FCE2EB;
  --c-pill:#C026A9;     --c-pill-l:#FBE3F6;
  /* مقياس شريط التحليل */
  --s-low:#2B7FB8;
  --s-good:#3E9E52;
  --s-mid:#E4A11B;
  --s-high:#C0392B;
  --r-s:10px; --r-m:16px; --r-l:22px; --r-xl:28px;
  --sp:16px;
  --shadow:0 1px 2px rgba(19,38,48,.05), 0 8px 24px -12px rgba(19,38,48,.16);
  --shadow-lift:0 2px 6px rgba(19,38,48,.07), 0 18px 40px -16px rgba(19,38,48,.28);
  /* منحنيات الحركة */
  --spring:cubic-bezier(.34,1.42,.5,1);
  --spring-soft:cubic-bezier(.32,1.2,.5,1);
  --out:cubic-bezier(.22,1,.36,1);
  --in-out:cubic-bezier(.62,0,.28,1);
  --t-fast:.16s; --t:.28s; --t-slow:.44s;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:"IBM Plex Sans Arabic",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  background:var(--paper); color:var(--ink);
  font-size:16px; line-height:1.62; font-weight:500;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
h1,h2,h3,h4,.display,.num{font-family:"Zain","IBM Plex Sans Arabic",sans-serif;font-weight:800;letter-spacing:0}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:var(--teal);text-decoration:none}
::-webkit-scrollbar{width:0;height:0}

#app{max-width:520px;margin:0 auto;min-height:100vh;min-height:100dvh;background:var(--paper);position:relative;padding-bottom:96px}
@media(min-width:560px){
  body{background:#CFDCD5}
  #app{box-shadow:0 0 60px rgba(14,42,51,.12);min-height:100dvh}
}

/* ============ الهيدر ============ */
.topbar{
  position:sticky;top:0;z-index:40;
  background:linear-gradient(148deg,#13503F 0%,var(--deep) 50%,#0E5C44 100%);color:var(--on-deep);
  padding:calc(env(safe-area-inset-top) + 14px) 18px 16px;
  border-radius:0 0 var(--r-xl) var(--r-xl);
}
.topbar-row{display:flex;align-items:center;gap:12px}
.avatar{
  width:44px;height:44px;border-radius:14px;flex:none;
  background:linear-gradient(145deg,var(--teal),#2ACB8C);
  display:grid;place-items:center;font-family:"Zain";font-size:20px;font-weight:800;color:#fff;
}
.hello{flex:1;min-width:0}
.hello small{display:block;color:#8FB0B6;font-size:12px;line-height:1.3}
.hello strong{display:block;font-family:"Zain";font-size:21px;font-weight:700;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{
  width:40px;height:40px;border-radius:12px;flex:none;
  background:rgba(255,255,255,.09);display:grid;place-items:center;color:#fff;
  transition:background .18s;
}
.icon-btn:active{background:rgba(255,255,255,.2)}
.icon-btn svg{width:20px;height:20px}

/* ============ الشريط — العنصر المميز ============ */
.strip-card{
  margin:-14px 14px 0;background:var(--surface);border-radius:var(--r-l);
  padding:18px 18px 14px;box-shadow:var(--shadow);position:relative;z-index:41;
}
.strip-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:2px}
.strip-label{font-size:13.2px;color:var(--muted);font-weight:700}
.strip-tag{
  font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:99px;
  background:var(--teal-l);color:var(--teal-d);
}
.strip-value{display:flex;align-items:baseline;gap:8px;margin:2px 0 4px}
.strip-value b{font-family:"Zain";font-size:52px;font-weight:900;line-height:1;letter-spacing:-1px}
.strip-value span{font-size:13px;color:var(--muted);font-weight:600}
.strip-meta{font-size:13px;color:var(--muted);margin-bottom:14px;font-weight:500}

.strip{position:relative;height:14px;border-radius:99px;overflow:visible;margin-bottom:8px;
  background:linear-gradient(90deg,var(--s-high) 0%,var(--s-mid) 22%,var(--s-good) 44%,var(--s-good) 62%,var(--s-mid) 80%,var(--s-high) 100%);
}
.strip-ticks{display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.marker{
  position:absolute;top:-5px;width:8px;height:24px;border-radius:99px;
  background:var(--ink);border:3px solid var(--surface);box-shadow:0 2px 6px rgba(0,0,0,.35);
  transform:translateX(50%);transition:right 1s var(--spring-soft);
}
.strip-empty{
  height:14px;border-radius:99px;background:repeating-linear-gradient(45deg,#E7EDEC,#E7EDEC 6px,#F2F6F5 6px,#F2F6F5 12px);
}


/* ============ ديك الكروت المتداخلة ============ */
.deck{
  position:relative;margin:-14px 14px 0;z-index:41;height:198px;
  touch-action:pan-y;user-select:none;-webkit-user-select:none;
}
.dcard{
  position:absolute;inset:0;border-radius:24px;background:var(--cc,var(--teal));
  padding-bottom:9px;cursor:grab;
  box-shadow:0 6px 22px -12px rgba(0,0,0,.45), 0 2px 6px rgba(0,0,0,.06);
  will-change:transform,opacity;
  transition:transform .55s var(--spring-soft), opacity .35s var(--out);
}
.dcard.dragging{transition:none;cursor:grabbing}
.dcard-in{
  height:100%;background:var(--surface);border-radius:20px;
  padding:15px 17px 13px;display:flex;flex-direction:column;overflow:hidden;
}
.dc-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.dc-lbl{font-size:13.2px;color:var(--muted);font-weight:700}
.dc-go{color:var(--muted);font-size:20px;line-height:1;opacity:.55}
.dc-val{display:flex;align-items:baseline;gap:8px;margin:1px 0 2px}
.dc-val b{font-family:"Zain";font-size:52px;font-weight:900;line-height:1;letter-spacing:-1px}
.dc-val span{font-size:13px;color:var(--muted);font-weight:700}
.dc-sub{font-size:13.5px;font-weight:700}
.dc-foot{margin-top:auto;font-size:12.5px;color:var(--muted);font-weight:500}
.deck-dots{display:flex;gap:6px;justify-content:center;margin-top:11px}
.deck-dots i{width:6px;height:6px;border-radius:99px;background:var(--line);transition:width .35s var(--spring),background .3s}
.deck-dots i.on{width:20px}
@media (prefers-reduced-motion:reduce){ .dcard{transition:none} }

/* ============ الحلقات ============ */
.rings{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:14px 14px 0}
.ring-card{background:var(--surface);border-radius:var(--r-m);padding:12px 8px;text-align:center;box-shadow:var(--shadow)}
.ring{position:relative;width:62px;height:62px;margin:0 auto 6px}
.ring svg{transform:rotate(-90deg)}
.ring .rv{position:absolute;inset:0;display:grid;place-items:center;font-family:"Zain";font-size:17px;font-weight:800}
.ring-card small{display:block;font-size:12.3px;color:var(--muted);font-weight:700}
.ring-card b{display:block;font-size:12.8px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:1px}

/* ============ الأقسام ============ */
.section{padding:22px 14px 0}
.sec-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;padding:0 4px}
.sec-head h2{font-size:20.5px;margin:0;font-weight:800}
.sec-head button{font-size:12.5px;color:var(--teal);font-weight:600}

.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.q{
  background:var(--surface);border-radius:var(--r-m);padding:12px 4px 10px;text-align:center;
  box-shadow:var(--shadow);transition:transform .12s;
}
.q:active{transform:scale(.94)}
.q i{display:block;width:34px;height:34px;margin:0 auto 6px;border-radius:11px;display:grid;place-items:center;background:var(--tint,var(--teal-l))}
.q i svg{width:19px;height:19px;color:var(--tone,var(--teal-d))}
.q span{font-size:12.3px;font-weight:700;display:block;line-height:1.3}

/* ============ الكروت والقوايم ============ */
.card{background:var(--surface);border-radius:var(--r-m);box-shadow:var(--shadow);overflow:hidden}
.card+.card{margin-top:10px}
.pad{padding:16px}
.row{display:flex;align-items:center;gap:12px;padding:13px 16px}
.row+.row{border-top:1px solid var(--line)}
.row .ic{width:38px;height:38px;border-radius:12px;flex:none;display:grid;place-items:center;background:var(--tint,var(--paper))}
.row .ic svg{width:18px;height:18px;color:var(--tone,var(--ink-2))}
.row .tx{flex:1;min-width:0}
.row .tx b{display:block;font-size:15.5px;font-weight:700;line-height:1.35}
.row .tx small{display:block;font-size:12.8px;color:var(--muted);font-weight:500}
.row .vl{text-align:left;flex:none}
.row .vl b{font-family:"Zain";font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.row .vl small{font-size:11px;color:var(--muted);display:block}

.dot{width:9px;height:9px;border-radius:99px;flex:none}
.pill{font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;display:inline-block}
.p-low{background:#E4F0F8;color:var(--s-low)}
.p-good{background:#E4F3E7;color:#2E7D3B}
.p-mid{background:#FBF0DA;color:#9A6B08}
.p-high{background:#F9E3E1;color:var(--s-high)}

.empty{text-align:center;padding:34px 20px;color:var(--muted)}
.empty svg{width:42px;height:42px;opacity:.35;margin-bottom:10px}
.empty b{display:block;font-family:"Zain";font-size:18px;color:var(--ink);margin-bottom:4px;font-weight:700}
.empty p{margin:0 0 14px;font-size:13px}

/* ============ الأزرار ============ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  background:var(--teal);color:#fff;font-weight:700;font-size:15px;
  padding:14px 20px;border-radius:14px;width:100%;transition:transform .12s,background .18s;
}
.btn:active{transform:scale(.97);background:var(--teal-d)}
.btn.ghost{background:var(--paper);color:var(--ink)}
.btn.dark{background:var(--deep);color:var(--on-deep)}
.btn.danger{background:#F9E3E1;color:var(--s-high)}
.btn.sm{padding:10px 14px;font-size:13.5px;width:auto;border-radius:11px}

/* ============ الفورمات ============ */
.field{margin-bottom:14px}
.field label{display:block;font-size:13.2px;font-weight:700;color:var(--muted);margin-bottom:6px}
.input,select.input,textarea.input{
  width:100%;background:var(--paper);border:1.5px solid transparent;border-radius:13px;
  padding:13px 14px;font-size:15px;outline:none;transition:border-color .18s,background .18s;
}
.input:focus{border-color:var(--teal);background:#fff}
textarea.input{resize:none;min-height:74px}
select.input{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236C8189' stroke-width='2.5' stroke-linecap='round'><path d='M6 9l6 6 6-6'/></svg>");background-repeat:no-repeat;background-position:left 14px center;background-size:16px}
.big-input{
  font-family:"Zain";font-size:44px;font-weight:900;text-align:center;
  background:var(--paper);border:none;border-radius:16px;padding:18px 10px;width:100%;outline:none;
  font-variant-numeric:tabular-nums;
}
.big-input:focus{background:var(--teal-l)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{
  padding:10px 15px;border-radius:12px;background:var(--paper);font-size:13.8px;font-weight:700;
  border:1.5px solid transparent;transition:.15s;
}
.chip.on{background:var(--deep);color:var(--on-deep);border-color:var(--deep)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hint{font-size:12.8px;color:var(--muted);line-height:1.6;margin:8px 0 0;font-weight:500}

/* ============ الشيت ============ */
.scrim{position:fixed;inset:0;background:rgba(9,28,22,.54);opacity:0;pointer-events:none;transition:opacity var(--t-slow) var(--out),backdrop-filter var(--t-slow) var(--out);z-index:90;backdrop-filter:blur(0)}
.scrim.on{backdrop-filter:blur(6px)}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:91;max-width:520px;margin:0 auto;
  background:var(--surface);border-radius:var(--r-xl) var(--r-xl) 0 0;
  transform:translateY(101%);transition:transform .5s var(--spring-soft);
  max-height:92dvh;display:flex;flex-direction:column;
}
.sheet.on{transform:translateY(0)}
.sheet-head{padding:16px 18px 12px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);flex:none}
.sheet-head h3{flex:1;margin:0;font-size:20px;font-weight:700}
.sheet-body{padding:18px;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:calc(env(safe-area-inset-bottom) + 22px)}
.grab{width:38px;height:4px;border-radius:99px;background:var(--line);margin:8px auto 0}

/* ============ النافيجيشن ============ */
.nav{
  position:fixed;bottom:0;left:0;right:0;z-index:60;max-width:520px;margin:0 auto;
  background:rgba(244,249,246,.94);backdrop-filter:blur(14px);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(5,1fr);
  padding:8px 6px calc(env(safe-area-inset-bottom) + 8px);
}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);padding:6px 0;position:relative}
.nav button svg{width:22px;height:22px}
.nav button span{font-size:11.2px;font-weight:700}
.nav button.on{color:var(--teal-d)}
.nav button.on::before{content:"";position:absolute;top:-8px;width:26px;height:3px;border-radius:99px;background:var(--teal)}

.fab{
  position:fixed;bottom:calc(env(safe-area-inset-bottom) + 76px);left:50%;transform:translateX(-50%);
  z-index:59;background:var(--deep);color:var(--on-deep);border-radius:99px;padding:13px 22px;
  display:flex;align-items:center;gap:8px;font-weight:700;font-size:14.5px;
  box-shadow:0 10px 26px -8px rgba(14,42,51,.55);transition:transform .15s;
}
.fab:active{transform:translateX(-50%) scale(.94)}
.fab svg{width:19px;height:19px}
@media(min-width:560px){.fab{left:auto;right:calc(50% - 260px + 16px);transform:none}.fab:active{transform:scale(.94)}}

/* ============ التبويبات ============ */
.tabs{display:flex;gap:7px;overflow-x:auto;padding:0 14px 2px;margin-bottom:2px}
.tab{padding:9px 15px;border-radius:11px;background:var(--surface);font-size:13.8px;font-weight:700;white-space:nowrap;flex:none;box-shadow:var(--shadow)}
.tab.on{background:var(--deep);color:var(--on-deep)}

/* ============ الشارت ============ */
.chart-wrap{padding:8px 4px 0}
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);padding:8px 6px 0}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-left:5px;vertical-align:-1px}

.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--surface);border-radius:var(--r-m);padding:14px;box-shadow:var(--shadow)}
.stat small{display:block;font-size:12.3px;color:var(--muted);font-weight:700;margin-bottom:2px}
.stat b{font-family:"Zain";font-size:27px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.15;display:block}
.stat u{text-decoration:none;font-size:11.5px;color:var(--muted)}

.toast{
  position:fixed;bottom:calc(env(safe-area-inset-bottom) + 140px);left:50%;transform:translate(-50%,14px);
  background:var(--deep);color:var(--on-deep);padding:12px 20px;border-radius:14px;font-size:13.5px;font-weight:600;
  z-index:120;opacity:0;pointer-events:none;transition:opacity var(--t) var(--out),transform .46s var(--spring);white-space:nowrap;max-width:88vw;
}
.toast.on{opacity:1;transform:translate(-50%,0)}

.alert{background:#F9E3E1;border-radius:14px;padding:13px 15px;font-size:13px;line-height:1.6;color:#8B2A20;margin-bottom:14px}
.alert b{display:block;font-family:"Zain";font-size:16px;margin-bottom:3px}
.note{background:var(--teal-l);border-radius:14px;padding:13px 15px;font-size:12.5px;line-height:1.65;color:var(--teal-d)}

.swipe-del{margin-right:auto;color:var(--s-high);padding:6px;opacity:.55}
.swipe-del svg{width:17px;height:17px}

.fade{animation:fade .45s cubic-bezier(.2,.8,.3,1) both}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}


/* ============ الوضع الليلي ============ */
:root[data-theme="dark"]{
  --ink:#E9F4F7;
  --deep:#17333B;
  --on-deep:#FFFFFF;
  --ink-2:#BCD2CF;
  --paper:#0A2027;
  --surface:#152C33;
  --line:#26424B;
  --muted:#8CA5AD;
  --teal:#5CC8F2;
  --teal-d:#9EDEF9;
  --teal-l:#12333D;
  --s-low:#4FC3F7;
  --s-good:#4ED88A;
  --s-mid:#FFB144;
  --s-high:#FF6B6B;
  --shadow:0 1px 2px rgba(0,0,0,.35), 0 10px 26px -14px rgba(0,0,0,.7);
}
:root[data-theme="dark"]{
  --c-glucose:#4FD8E4;  --c-glucose-l:#103A42;
  --c-a1c:#A78BFA;      --c-a1c-l:#251F46;
  --c-weight:#6BB6FF;   --c-weight-l:#15304C;
  --c-meal:#FF9F45;     --c-meal-l:#3A2814;
  --c-water:#4FC3F7;    --c-water-l:#123444;
  --c-run:#7BD88F;      --c-run-l:#14351F;
  --c-bp:#FF6B8A;       --c-bp-l:#3C1B26;
  --c-pill:#C77DFF;    --c-pill-l:#2E1B45;
  --shadow-lift:0 2px 8px rgba(0,0,0,.4), 0 20px 46px -18px rgba(0,0,0,.75);
}
:root[data-theme="dark"] body{background:var(--paper)}
:root[data-theme="dark"] .p-low{background:#123644;color:#79CDF5}
:root[data-theme="dark"] .p-good{background:#123326;color:#6FE2A2}
:root[data-theme="dark"] .p-mid{background:#332614;color:#FFC66B}
:root[data-theme="dark"] .p-high{background:#3A1D20;color:#FF8C8C}
:root[data-theme="dark"] .nav{background:rgba(18,40,47,.95)}
:root[data-theme="dark"] .alert{background:#3A1D20;color:#FFA9A9}
:root[data-theme="dark"] .strip-empty{background:repeating-linear-gradient(45deg,#1B3A44,#1B3A44 6px,#20424D 6px,#20424D 12px)}
:root[data-theme="dark"] select.input{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%238AA3A8' stroke-width='2.5' stroke-linecap='round'><path d='M6 9l6 6 6-6'/></svg>")}
:root[data-theme="dark"] .icon-btn{background:rgba(255,255,255,.1)}
@media(min-width:560px){:root[data-theme="dark"] body{background:#061418}}


/* ---- الوضع الليلي: تدرّجات ---- */
:root[data-theme="dark"] .topbar{background:linear-gradient(150deg,#1D414B 0%,#17333B 52%,#123039 100%)}
:root[data-theme="dark"] .avatar{background:linear-gradient(145deg,#4FB8E8,#7FD6F7)}
:root[data-theme="dark"] #app{
  background:
    radial-gradient(120% 55% at 50% 0%, #123840 0%, rgba(18,56,64,0) 62%),
    var(--paper);
}
:root[data-theme="dark"] .dcard{box-shadow:0 8px 26px -12px rgba(0,0,0,.7), 0 2px 8px rgba(0,0,0,.35)}
:root[data-theme="dark"] .scrim{background:rgba(4,16,20,.62)}

/* ============ نظام الحركة ============ */
@keyframes screenIn{
  0%{opacity:0;transform:translate3d(var(--dx),8px,0) scale(.982)}
  100%{opacity:1;transform:translate3d(0,0,0) scale(1)}
}
#screen.anim-next{--dx:-16px;animation:screenIn var(--t-slow) var(--out) both}
#screen.anim-prev{--dx:16px;animation:screenIn var(--t-slow) var(--out) both}
#screen.anim-next>*,#screen.anim-prev>*{animation:riseIn .5s var(--spring-soft) both}
#screen>*:nth-child(1){animation-delay:0s}
#screen>*:nth-child(2){animation-delay:.035s}
#screen>*:nth-child(3){animation-delay:.07s}
#screen>*:nth-child(4){animation-delay:.105s}
#screen>*:nth-child(5){animation-delay:.14s}
#screen>*:nth-child(6){animation-delay:.175s}
#screen>*:nth-child(n+7){animation-delay:.21s}
@keyframes riseIn{from{opacity:0;transform:translate3d(0,14px,0)}to{opacity:1;transform:none}}

.nav button{transition:color var(--t) var(--out)}
.nav button svg{transition:transform var(--t) var(--spring)}
.nav button:active svg{transform:scale(.86)}
.nav button.on svg{animation:navPop .52s var(--spring)}
@keyframes navPop{0%{transform:scale(.8) translateY(2px)}55%{transform:scale(1.2) translateY(-2px)}100%{transform:scale(1) translateY(0)}}
.nav button.on::before{animation:barGrow .42s var(--spring) both}
@keyframes barGrow{0%{width:0;opacity:0}60%{width:32px;opacity:1}100%{width:26px;opacity:1}}

/* لمسات دقيقة */
.q,.card,.stat,.chip,.btn,.tab,.icon-btn,.row{will-change:auto}
.q{transition:transform var(--t) var(--spring),box-shadow var(--t) var(--out)}
.q:active{transform:scale(.93)}
.q i{transition:transform var(--t) var(--spring)}
.q:active i{transform:scale(1.14) rotate(-4deg)}
.btn{transition:transform var(--t) var(--spring),background var(--t-fast) linear,box-shadow var(--t) var(--out)}
.btn:active{transform:scale(.965)}
.chip{transition:transform var(--t) var(--spring),background var(--t-fast) linear,color var(--t-fast) linear,border-color var(--t-fast) linear}
.chip:active{transform:scale(.93)}
.chip.on{animation:chipPop .34s var(--spring)}
@keyframes chipPop{0%{transform:scale(.9)}60%{transform:scale(1.06)}100%{transform:scale(1)}}
.tab{transition:transform var(--t) var(--spring),background var(--t-fast) linear,color var(--t-fast) linear}
.tab:active{transform:scale(.94)}
.icon-btn{transition:transform var(--t) var(--spring),background var(--t-fast) linear}
.icon-btn:active{transform:scale(.88)}
.stat{transition:transform var(--t) var(--spring),box-shadow var(--t) var(--out)}
.stat[onclick]:active{transform:scale(.975);box-shadow:var(--shadow-lift)}
.row{transition:background var(--t-fast) var(--out)}
.card .row[onclick]:active,.row.tap:active{background:var(--paper)}
.row .ic{transition:transform var(--t) var(--spring)}
.card .row[onclick]:active .ic{transform:scale(1.1)}
.ring-card{transition:transform var(--t) var(--spring)}
.ring-card:active{transform:scale(.96)}

/* دخول العناصر */
.rings .ring-card:nth-child(2){animation-delay:.06s}
.rings .ring-card:nth-child(3){animation-delay:.12s}
.quick .q{animation:riseIn .46s var(--spring-soft) both}
.quick .q:nth-child(1){animation-delay:.02s}.quick .q:nth-child(2){animation-delay:.05s}
.quick .q:nth-child(3){animation-delay:.08s}.quick .q:nth-child(4){animation-delay:.11s}
.quick .q:nth-child(5){animation-delay:.14s}.quick .q:nth-child(6){animation-delay:.17s}
.quick .q:nth-child(7){animation-delay:.2s}.quick .q:nth-child(8){animation-delay:.23s}
.insight{animation:riseIn .44s var(--spring-soft) both}
.insight:nth-child(2){animation-delay:.05s}.insight:nth-child(3){animation-delay:.1s}
.insight:nth-child(4){animation-delay:.15s}.insight:nth-child(5){animation-delay:.2s}

/* الشرايط والحلقات */
.bar-fill{transform-origin:right center;animation:barFill .95s var(--out) both;animation-delay:.12s}
@keyframes barFill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.ring svg circle:last-child{animation:ringDraw 1.05s var(--out) both;animation-delay:.1s}
@keyframes ringDraw{from{stroke-dashoffset:var(--c-full)}to{stroke-dashoffset:var(--c-off)}}

/* المنحنيات */
.chart path[data-line]{animation:drawLine 1.1s var(--out) both;animation-delay:.15s}
@keyframes drawLine{from{stroke-dasharray:var(--len);stroke-dashoffset:var(--len)}to{stroke-dasharray:var(--len);stroke-dashoffset:0}}
.chart circle{animation:dotIn .4s var(--spring) both}
.chart rect[data-bar]{transform-origin:bottom;animation:barUp .7s var(--spring-soft) both}
@keyframes barUp{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes dotIn{from{opacity:0;transform:scale(0)}to{opacity:1;transform:scale(1)}}

/* ============ الرؤى والسلسلة ============ */
.streak{
  margin:14px 14px 0;background:var(--deep);color:var(--on-deep);border-radius:var(--r-m);
  padding:14px 16px;display:flex;align-items:center;gap:14px;box-shadow:var(--shadow);
}
.streak .fl{width:42px;height:42px;border-radius:13px;background:rgba(255,255,255,.12);display:grid;place-items:center;flex:none}
.streak .fl svg{width:21px;height:21px;color:#FFB86B}
.streak b{font-family:"Zain";font-size:23px;font-weight:800;line-height:1.1;display:block}
.streak small{font-size:12px;opacity:.72;display:block}
.streak .days{display:flex;gap:5px;margin-right:auto;flex:none}
.streak .days i{width:9px;height:22px;border-radius:99px;background:rgba(255,255,255,.16)}
.streak .days i.hit{background:#7FD9D3}

.insight{display:flex;gap:12px;padding:13px 16px;align-items:flex-start}
.insight+.insight{border-top:1px solid var(--line)}
.insight .ib{width:32px;height:32px;border-radius:10px;flex:none;display:grid;place-items:center;background:var(--teal-l);color:var(--teal-d)}
.insight .ib svg{width:16px;height:16px}
.insight p{margin:0;font-size:14.2px;line-height:1.62;font-weight:500}
.insight p b{font-weight:700}

/* ============ شاشة الحساب ============ */
.auth{position:fixed;inset:0;z-index:190;background:var(--paper);display:none;
  flex-direction:column;justify-content:center;padding:28px 24px;overflow-y:auto}
.auth.on{display:flex}
.auth-box{max-width:400px;margin:0 auto;width:100%}
.auth h2{font-size:25px;margin:22px 0 4px;text-align:center}
.auth .sub{color:var(--muted);font-size:13.5px;text-align:center;margin:0 0 24px;line-height:1.6}
.auth-err{background:#F9E3E1;color:#8B2A20;border-radius:12px;padding:11px 14px;font-size:13px;margin-bottom:14px}
:root[data-theme="dark"] .auth-err{background:#3A1A17;color:#F5A79F}
.auth-switch{text-align:center;margin-top:18px;font-size:13.5px;color:var(--muted)}
.auth-switch button{color:var(--teal);font-weight:700}
.sync-dot{width:8px;height:8px;border-radius:99px;background:#8FB0B6;display:inline-block;transition:background .3s}
.sync-dot.ok{background:#3ED07E}
.sync-dot.sync{background:#E4A11B;animation:pulseDot 1s infinite}
.sync-dot.off{background:#E0655B}
@keyframes pulseDot{0%,100%{opacity:1}50%{opacity:.35}}

/* ============ قفل الكود ============ */
.lock{
  position:fixed;inset:0;z-index:200;background:var(--paper);
  display:none;flex-direction:column;align-items:center;justify-content:center;padding:30px;
}
.lock.on{display:flex}
.lock h2{font-size:26px;margin:0 0 4px}
.lock p{color:var(--muted);font-size:13.5px;margin:0 0 26px}
.dots{display:flex;gap:14px;margin-bottom:30px}
.dots i{width:14px;height:14px;border-radius:99px;border:2px solid var(--line);transition:.2s}
.dots i.f{background:var(--teal);border-color:var(--teal);transform:scale(1.12)}
.keys{display:grid;grid-template-columns:repeat(3,72px);gap:14px}
.keys button{
  height:64px;border-radius:20px;background:var(--surface);box-shadow:var(--shadow);
  font-family:"Zain";font-size:26px;font-weight:800;transition:transform .1s;
}
.keys button:active{transform:scale(.9);background:var(--teal-l)}
.keys button.wide{font-size:14px;font-family:"IBM Plex Sans Arabic";font-weight:600;background:transparent;box-shadow:none;color:var(--muted)}
.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}

/* احترام إعداد «تقليل الحركة» — يغلب كل ما سبق */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-delay:0s!important;transition-duration:.001ms!important}
  #screen.anim-next,#screen.anim-prev,#screen>*{animation:none!important;opacity:1!important;transform:none!important}
  .sheet{transition:transform .12s linear}
}

@media print{
  .nav,.fab,.topbar .icon-btn,.quick,.sheet,.scrim{display:none!important}
  #app{max-width:none;padding:0;box-shadow:none}
  body{background:#fff}
}
</style>
</head>
<body>
<div id="app">
  <div id="screen"></div>
</div>

<nav class="nav" id="nav"></nav>
<button class="fab" id="fab">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
  تسجيل جديد
</button>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet">
  <div class="grab"></div>
  <div class="sheet-head">
    <h3 id="sheetTitle"></h3>
    <button class="icon-btn" style="background:var(--paper);color:var(--ink)" onclick="closeSheet()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
    </button>
  </div>
  <div class="sheet-body" id="sheetBody"></div>
</div>

<div class="auth" id="auth">
  <div class="auth-box">
    <div id="authLogo"></div>
    <h2 id="authTitle">تسجيل الدخول</h2>
    <p class="sub" id="authSub">دخول بحسابك علشان بياناتك تتزامن على كل أجهزتك</p>
    <div id="authErr"></div>
    <div class="field"><label>اسم المستخدم</label>
      <input class="input" id="auUser" autocapitalize="none" autocomplete="username" spellcheck="false" placeholder="حروف إنجليزية وأرقام"></div>
    <div class="field"><label>كلمة السر</label>
      <input class="input" id="auPass" type="password" autocomplete="current-password" placeholder="٨ حروف على الأقل"></div>
    <div class="field" id="auCodeWrap" style="display:none"><label>كود التسجيل</label>
      <input class="input" id="auCode" autocapitalize="none" spellcheck="false" placeholder="الكود اللي ظبطته على السيرفر"></div>
    <button class="btn" id="auGo" onclick="doAuth()">دخول</button>
    <div class="auth-switch">
      <span id="auSwitchTx">معندكش حساب؟</span>
      <button onclick="toggleAuthMode()" id="auSwitchBtn">اعمل حساب جديد</button>
    </div>
    <p class="hint" style="text-align:center;margin-top:18px">بياناتك بتتخزن على السيرفر بتاعك اللي انت رافعه، ومحدش تاني بيشوفها.</p>
  </div>
</div>

<div class="lock" id="lock">
  <div id="lockLogo" style="width:78px;height:78px;margin-bottom:14px"></div>
  <h2 id="lockTitle">My Life</h2>
  <p id="lockMsg">اكتب الكود بتاعك</p>
  <div class="dots" id="lockDots"></div>
  <div class="keys" id="lockKeys"></div>
</div>

<div class="toast" id="toast"></div>
<script>
/* ==========================================================
   My Life — برنامج متابعة صحية متكامل
   ملف واحد • بدون أي مكتبات خارجية • يشتغل أوفلاين
   ========================================================== */

/* ---------- الأيقونات ---------- */
const I = {
  glucose:'<path d="M12 3s6 6.4 6 10a6 6 0 1 1-12 0c0-3.6 6-10 6-10z"/>',
  a1c:'<path d="M3 17a9 9 0 0 1 18 0"/><path d="M12 17l4-5"/><circle cx="12" cy="17" r="1.4"/>',
  weight:'<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 11a4 4 0 0 1 8 0"/><path d="M12 11V9"/>',
  meal:'<path d="M6 3v8a2 2 0 0 0 4 0V3"/><path d="M8 11v10"/><path d="M17 3c-1.4 1.6-2 3.4-2 5.5 0 1.6.7 2.5 2 2.5v10"/>',
  water:'<path d="M6 4h12l-1.4 15a2 2 0 0 1-2 1.8H9.4a2 2 0 0 1-2-1.8z"/><path d="M6.6 11h10.8"/>',
  run:'<circle cx="15" cy="4.5" r="1.8"/><path d="M9 21l2.5-5 3-2-1-4.5"/><path d="M8 10l3.5-2.5 3 1.5 3 1"/><path d="M13.5 14l2.5 3 1 4"/>',
  bp:'<circle cx="12" cy="13" r="6"/><path d="M12 13l2.5-2.5"/><path d="M9 4h6"/><path d="M12 4v3"/>',
  pill:'<rect x="3" y="9" width="18" height="6.5" rx="3.25" transform="rotate(-45 12 12)"/><path d="M9 9l6 6"/>',
  home:'<path d="M4 11l8-7 8 7v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/>',
  list:'<path d="M8 6h13M8 12h13M8 18h13"/><path d="M3.5 6h.01M3.5 12h.01M3.5 18h.01"/>',
  chart:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
  user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6.5 8-6.5s8 2.5 8 6.5"/>',
  bell:'<path d="M18 9a6 6 0 1 0-12 0c0 6-2 7-2 7h16s-2-1-2-7"/><path d="M10.5 20a2 2 0 0 0 3 0"/>',
  trash:'<path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2M6 7l1 13a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-13"/>',
  edit:'<path d="M4 20h4L20 8l-4-4L4 16z"/>',
  check:'<path d="M4 12.5l5 5L20 6.5"/>',
  print:'<path d="M6 9V3h12v6"/><rect x="3" y="9" width="18" height="8" rx="2"/><path d="M6 14h12v7H6z"/>',
  down:'<path d="M12 4v12M6 11l6 6 6-6M4 20h16"/>',
  up:'<path d="M12 20V8M6 13l6-6 6 6M4 4h16"/>',
  info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>',
  flame:'<path d="M12 3c3 4 6 5.5 6 9a6 6 0 0 1-12 0c0-2 1-3.4 2-4.5.4 1.5 1.2 2 2 2 .6-2.5.8-4.5 2-6.5z"/>'
};
/* ---------- اللوجو ---------- */
const LOGO_MARK = `<svg viewBox="0 0 512 512" fill="none" aria-hidden="true">
  <defs><linearGradient id="mlg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#12B37A"/><stop offset="1" stop-color="#067A52"/></linearGradient></defs>
  <rect width="512" height="512" rx="116" fill="url(#mlg)"/>
  <path d="M256 356s-92-58-92-120a50 50 0 0 1 92-26 50 50 0 0 1 92 26c0 62-92 120-92 120z" stroke="#fff" stroke-width="24" stroke-linejoin="round"/>
  <path d="M172 252h44l24-44 32 84 22-40h46" stroke="#fff" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
</svg>`;
const logoLockup = (size=48)=>`<div style="display:flex;align-items:center;gap:12px;justify-content:center">
  <span style="width:${size}px;height:${size}px;display:block;flex:none">${LOGO_MARK}</span>
  <span style="line-height:1.2;text-align:right"><b style="font-family:Zain;font-size:${Math.round(size*0.56)}px;font-weight:800;display:block">My Life</b>
  <small style="font-size:${Math.round(size*0.27)}px;color:var(--muted)">متابعة صحتك اليومية</small></span></div>`;

/* ---------- ألوان الأقسام ---------- */
const TINT = {
  glucose:['--c-glucose-l','--c-glucose'], a1c:['--c-a1c-l','--c-a1c'],
  weight:['--c-weight-l','--c-weight'],    meal:['--c-meal-l','--c-meal'],
  water:['--c-water-l','--c-water'],       run:['--c-run-l','--c-run'],
  bp:['--c-bp-l','--c-bp'],                pill:['--c-pill-l','--c-pill'],
  check:['--c-run-l','--c-run'],           info:['--c-a1c-l','--c-a1c'],
  flame:['--c-meal-l','--c-meal'],         list:['--paper','--ink-2'],
  down:['--c-run-l','--c-run'],            up:['--c-bp-l','--c-bp'],
  meals:['--c-meal-l','--c-meal'],         activity:['--c-run-l','--c-run'],
  med:['--c-pill-l','--c-pill']
};
const tintOf = k => { const t = TINT[k] || ['--paper','--ink-2'];
  return `--tint:var(${t[0]});--tone:var(${t[1]})`; };

const svg = (k,w=2)=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${I[k]||''}</svg>`;

/* ---------- التخزين (يشتغل داخل التطبيق أو كملف محلي) ---------- */
const KEY = 'mylife.health.v1';
const Store = {
  async load(){
    try{ if(window.storage){ const r = await window.storage.get(KEY); if(r && r.value) return JSON.parse(r.value); } }catch(e){}
    try{ const s = localStorage.getItem(KEY); if(s) return JSON.parse(s); }catch(e){}
    return null;
  },
  async save(d){
    const s = JSON.stringify(d);
    try{ if(window.storage) await window.storage.set(KEY, s); }catch(e){}
    try{ localStorage.setItem(KEY, s); }catch(e){}
  }
};

/* ---------- الحالة ---------- */
const blank = ()=>({
  profile:{ name:'', gender:'male', birthYear:1990, height:170, targetWeight:0, startWeight:0, unit:'mg',
    theme:'auto', notify:false, pin:'',
    targets:{ fasting:[80,130], post:[80,180], a1c:7, calories:2000, carbs:200, water:2500, steps:30 } },
  glucose:[], a1c:[], weight:[], bp:[], meals:[], water:[], activity:[], meds:[], medLog:[],
  shots:[], labs:[],
  tombs:[], profU:0,
  created: Date.now()
});
let S = blank();
let view = 'home';
let recTab = 'glucose';
let repRange = 30;

function save(){ stampChanges(); Store.save(S); scheduleSync(); }
const uid  = ()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);

/* ---------- أدوات ---------- */
const pad = n=>String(n).padStart(2,'0');
const dayKey = ts=>{const d=new Date(ts);return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`};
const today  = ()=>dayKey(Date.now());
const AR_MONTHS=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
const AR_DAYS=['الأحد','الإتنين','التلات','الأربع','الخميس','الجمعة','السبت'];

function fmtTime(ts){const d=new Date(ts);let h=d.getHours();const m=pad(d.getMinutes());const ap=h<12?'ص':'م';h=h%12||12;return `${h}:${m} ${ap}`}
function fmtDate(ts){const d=new Date(ts);return `${d.getDate()} ${AR_MONTHS[d.getMonth()]}`}
function fmtFull(ts){const d=new Date(ts);return `${AR_DAYS[d.getDay()]} ${d.getDate()} ${AR_MONTHS[d.getMonth()]}`}
function relDay(ts){
  const k=dayKey(ts);
  if(k===today()) return 'النهارده';
  if(k===dayKey(Date.now()-864e5)) return 'إمبارح';
  return fmtFull(ts);
}
function localInput(ts){const d=new Date(ts);return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`}
function greet(){const h=new Date().getHours();return h<12?'صباح الخير':h<17?'نهارك سعيد':'مساء الخير'}
const esc = s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sum = a=>a.reduce((x,y)=>x+y,0);
const avg = a=>a.length? sum(a)/a.length : 0;
const r1  = n=>Math.round(n*10)/10;

/* تحويل الوحدات */
const toMg   = v => S.profile.unit==='mmol' ? v*18 : v;
const fromMg = v => S.profile.unit==='mmol' ? r1(v/18) : Math.round(v);
const gUnit  = ()=> S.profile.unit==='mmol' ? 'mmol/L' : 'mg/dL';

/* أوقات قياس السكر */
const TAGS = {
  fasting:{ ar:'صايم', range:[80,130] },
  pre:    { ar:'قبل الأكل', range:[80,130] },
  post:   { ar:'بعد الأكل بساعتين', range:[80,180] },
  random: { ar:'عشوائي', range:[80,180] },
  bed:    { ar:'قبل النوم', range:[90,150] },
  night:  { ar:'أثناء الليل', range:[80,140] }
};

/* تقييم قراءة السكر (بالـ mg/dL) */
function tagRange(tag){
  const T = S.profile.targets;
  if(tag==='fasting'||tag==='pre') return T.fasting;
  if(tag==='bed') return [90,150];
  return T.post;
}
function gStatus(mg, tag){
  const [lo,hi] = tagRange(tag);
  if(mg < 54)  return {k:'low',  cls:'p-low',  col:'var(--s-low)',  ar:'هبوط شديد', pos:0.04};
  if(mg < lo)  return {k:'low',  cls:'p-low',  col:'var(--s-low)',  ar:'أقل من المستهدف', pos:0.16};
  if(mg <= hi) return {k:'good', cls:'p-good', col:'var(--s-good)', ar:'في النطاق المستهدف', pos:0.5};
  if(mg <= hi+70) return {k:'mid', cls:'p-mid', col:'var(--s-mid)', ar:'أعلى من المستهدف', pos:0.82};
  return {k:'high', cls:'p-high', col:'var(--s-high)', ar:'مرتفع', pos:0.95};
}

/* ضغط الدم */
function bpStatus(sys,dia){
  if(sys<90||dia<60) return {cls:'p-low', ar:'منخفض'};
  if(sys<120&&dia<80) return {cls:'p-good', ar:'طبيعي'};
  if(sys<130&&dia<80) return {cls:'p-good', ar:'مقبول'};
  if(sys<140||dia<90) return {cls:'p-mid', ar:'مرتفع قليلاً'};
  if(sys<180&&dia<120) return {cls:'p-high', ar:'مرتفع'};
  return {cls:'p-high', ar:'مرتفع جداً'};
}

/* مؤشر كتلة الجسم */
function bmiInfo(kg){
  const h = S.profile.height/100; if(!h||!kg) return null;
  const v = kg/(h*h);
  let ar='طبيعي', cls='p-good';
  if(v<18.5){ar='أقل من الطبيعي';cls='p-mid'}
  else if(v<25){ar='وزن طبيعي';cls='p-good'}
  else if(v<30){ar='زيادة في الوزن';cls='p-mid'}
  else {ar='سِمنة';cls='p-high'}
  return {v:r1(v), ar, cls};
}

/* السكر التراكمي → متوسط تقديري */
const a1cToAvg = a => 28.7*a - 46.7;
const avgToA1c = m => (m + 46.7)/28.7;
function a1cStatus(v){
  if(v < 5.7) return {cls:'p-good', ar:'ضمن الطبيعي'};
  if(v < 6.5) return {cls:'p-mid',  ar:'حدّي'};
  if(v <= S.profile.targets.a1c) return {cls:'p-good', ar:'ضمن هدفك'};
  if(v < 8)   return {cls:'p-mid',  ar:'أعلى من هدفك'};
  return {cls:'p-high', ar:'مرتفع'};
}

/* السعرات المقدَّرة للحفاظ على الوزن */
function maintenanceCals(){
  const w = lastVal('weight'); const h = S.profile.height;
  const age = new Date().getFullYear() - (S.profile.birthYear||1990);
  if(!w||!h) return null;
  const bmr = S.profile.gender==='male' ? 10*w + 6.25*h - 5*age + 5 : 10*w + 6.25*h - 5*age - 161;
  return Math.round(bmr*1.4);
}

/* آخر قيمة */
function lastRec(k){ const a=S[k]; return a && a.length ? [...a].sort((x,y)=>y.ts-x.ts)[0] : null }
function lastVal(k){ const r=lastRec(k); return r ? r.value : null }
function ofDay(k, day){ return (S[k]||[]).filter(r=>dayKey(r.ts)===day) }
function inDays(k, n){ const t=Date.now()-n*864e5; return (S[k]||[]).filter(r=>r.ts>=t).sort((a,b)=>a.ts-b.ts) }

<script>
/* ==========================================================
   الشاشات
   ========================================================== */
const $ = id=>document.getElementById(id);

const ORDER = ['home','records','journey','assistant','reports','meds','profile'];
function render(dir){
  const el = $('screen');
  el.innerHTML = ({home:renderHome, records:renderRecords, journey:renderJourney, assistant:renderAssistant, reports:renderReports, meds:renderMeds, profile:renderProfile}[view])();
  renderNav();
  if(dir){
    el.classList.remove('anim-next','anim-prev');
    void el.offsetWidth;
    el.classList.add(dir==='prev' ? 'anim-prev' : 'anim-next');
  }
  try{ window.scrollTo({top:0}); }catch(e){}
  if(view==='home') requestAnimationFrame(()=>{ initDeck(); placeMarker(); });
  requestAnimationFrame(countUp);
}

function renderNav(){
  const items = [
    ['home','الرئيسية','home'], ['records','السجلات','list'], ['assistant','المساعد','info'],
    ['reports','التقارير','chart'], ['profile','حسابي','user']
  ];
  const act = view==='journey' ? 'records' : (view==='meds' ? 'assistant' : view);
  $('nav').innerHTML = items.map(([k,ar,ic])=>
    `<button class="${act===k?'on':''}" onclick="go('${k}')">${svg(ic,1.9)}<span>${ar}</span></button>`).join('');
}
/* عدّاد تصاعدي للأرقام الكبيرة — تجميلي بحت، النص النهائي بيرجع زي ما هو */
const REDUCE = ()=> window.matchMedia && matchMedia('(prefers-reduced-motion:reduce)').matches;
function countUp(){
  if(REDUCE()) return;
  const els = document.querySelectorAll('#screen .stat b.num, #screen .strip-value b.num');
  els.forEach(el=>{
    const finalHTML = el.innerHTML;
    const txt = (el.textContent||'').trim();
    const m = txt.match(/^(-?\d+(?:\.\d+)?)/);
    if(!m) return;
    const target = parseFloat(m[1]);
    if(!isFinite(target) || Math.abs(target) < 2) return;
    const dec = (m[1].split('.')[1]||'').length;
    const rest = finalHTML.slice(finalHTML.indexOf(m[1]) + m[1].length);
    const t0 = performance.now(), dur = 620;
    const step = now=>{
      const k = Math.min(1,(now-t0)/dur);
      const e = 1 - Math.pow(1-k, 3);
      el.innerHTML = (target*e).toFixed(dec) + rest;
      if(k < 1) requestAnimationFrame(step); else el.innerHTML = finalHTML;
    };
    el.innerHTML = (0).toFixed(dec) + rest;
    requestAnimationFrame(step);
  });
}

function go(v){
  if(v===view) return;
  const dir = ORDER.indexOf(v) > ORDER.indexOf(view) ? 'next' : 'prev';
  view = v; closeSheet(); render(dir);
}

/* ---------------- الهيدر ---------------- */

      </button>
      <button class="icon-btn" onclick="go('meds')" style="position:relative">
        ${svg('bell',1.9)}
        ${due?`<i style="position:absolute;top:6px;left:6px;width:8px;height:8px;border-radius:99px;background:#FF7A45"></i>`:''}
      </button>
    </div>
  </div>`;
}

/* ---------------- الرئيسية ---------------- */
function renderHome(){

  const strip = deckHTML();

  const rings = `<div class="rings">
    ${ring(cals, T.calories, 'سعرات', `${cals} / ${T.calories}`, 'var(--s-mid)')}
    ${mjRing()}
    ${ring(act, T.steps, 'حركة', `${act} / ${T.steps} د`, 'var(--s-good)')}

  /* تسجيل سريع */
  const quick = `<div class="section">
    <div class="sec-head"><h2>تسجيل سريع</h2></div>
    <div class="quick">
      ${qBtn('glucose','سكر الدم','glucose')}
      ${qBtn('a1c','التراكمي','a1c')}
      ${qBtn('meal','أكل','meal')}
      ${qBtn('weight','وزن','weight')}
      ${qBtn('shot','مونجارو','pill')}
      ${qBtn('lab','تحاليل','chart')}
      ${qBtn('activity','رياضة','run')}
      ${qBtn('water','مياه','water')}
    </div>
  </div>`;

  /* تحذير الطوارئ */
  let warn = '';
  if(g && (g.mg < 54 || g.mg >= 300)){
    warn = `<div class="section"><div class="alert">
      <b>القراءة دي محتاجة انتباه</b>
      ${g.mg<54 ? 'السكر نازل أوي. لو حاسس بدوخة أو رعشة أو عرق، تناول سكريات سريعة حالاً وكلّم دكتورك.' :
        'السكر عالي جداً في القراءة دي. راجع دكتورك، ولو معاك أعراض زي القيء أو صعوبة التنفس روح الطوارئ فوراً.'}
    </div></div>`;
  }

  /* آخر التسجيلات */
  const feed = latestFeed(6);
  const recent = `<div class="section">
    <div class="sec-head"><h2>آخر التسجيلات</h2><button onclick="go('records')">شوف الكل</button></div>
    ${feed.length ? `<div class="card">${feed.map(rowOf).join('')}</div>` : emptyBox('لسه مفيش حاجة اتسجلت','ابدأ بأول قراءة سكر أو وجبة، والبرنامج هيبني لك التقارير لوحده.')}
  </div>`;

  /* نظرة سريعة */
  const w = lastRec('weight'); const a = lastRec('a1c');
  const bmi = w ? bmiInfo(w.value) : null;
  const glance = `<div class="section">
    <div class="sec-head"><h2>نظرة سريعة</h2></div>
    <div class="stat-grid">
      <div class="stat" onclick="go('journey')" style="cursor:pointer"><small>الوزن الحالي</small><b class="num">${w? r1(w.value):'—'}<u> كجم</u></b>
        ${bmi?`<span class="pill ${bmi.cls}" style="margin-top:6px">BMI ${bmi.v} • ${bmi.ar}</span>`:'<u>سجّل وزنك عشان نحسب الـ BMI</u>'}
        <u style="display:block;margin-top:6px;color:var(--teal)">رحلة الوزن ←</u></div>
      <div class="stat"><small>السكر التراكمي</small><b class="num">${a? r1(a.value):'—'}<u> %</u></b>
        ${a?`<span class="pill ${a1cStatus(a.value).cls}" style="margin-top:6px">${a1cStatus(a.value).ar}</span>`:'<u>آخر تحليل HbA1c</u>'}</div>
    </div>
  </div>`;

  return topbar() + strip + streakCard() + rings + warn + alertsCard(3) + quick + glance + journeyBanner() + recent;
}

function mjRing(){
  const L = mjLabel();
  const R=26, C=2*Math.PI*R, p=Math.min(1,Math.max(0,L.pct));
  return `<div class="ring-card fade" onclick="go('assistant')" style="cursor:pointer">
    <div class="ring">
      <svg width="62" height="62" viewBox="0 0 62 62">
        <circle cx="31" cy="31" r="${R}" fill="none" stroke="var(--paper)" stroke-width="7"/>
        <circle cx="31" cy="31" r="${R}" fill="none" stroke="${L.col}" stroke-width="7" stroke-linecap="round"
          stroke-dasharray="${C}" stroke-dashoffset="${C*(1-p)}" style="--c-full:${C};--c-off:${C*(1-p)}"/>
      </svg>
      <div class="rv num" style="font-size:${L.big.length>3?'12px':'17px'}">${L.big}</div>
    </div>
    <small>المونجارو</small><b>${L.sub}</b>
  </div>`;
}

function qBtn(kind,label,icon){
  return `<button class="q" style="${tintOf(icon)}" onclick="openLog('${kind}')"><i>${svg(icon,2)}</i><span>${label}</span></button>`;
}

function ring(val,target,label,sub,col){
  const p = target? Math.min(val/target,1) : 0;
  const R=26, C=2*Math.PI*R;
  return `<div class="ring-card fade">
    <div class="ring">
      <svg width="62" height="62" viewBox="0 0 62 62">
        <circle cx="31" cy="31" r="${R}" fill="none" stroke="var(--paper)" stroke-width="7"/>
        <circle cx="31" cy="31" r="${R}" fill="none" stroke="${col}" stroke-width="7" stroke-linecap="round"
          stroke-dasharray="${C}" stroke-dashoffset="${C*(1-p)}"
          style="--c-full:${C};--c-off:${C*(1-p)}"/>
      </svg>
      <div class="rv num">${Math.round(p*100)}<span style="font-size:10px">%</span></div>
    </div>
    <small>${label}</small><b class="num">${sub}</b>
  </div>`;
}

function placeMarker(){
  const m = $('marker'), p = $('markerPos');
  if(m && p){ requestAnimationFrame(()=>{ m.style.right = (parseFloat(p.value)*100)+'%'; }); }
}

/* ---------------- عناصر الفييد ---------------- */
function latestFeed(n){
  const out=[];
  const push=(k,arr)=>arr.forEach(r=>out.push({k,r}));
  push('glucose',S.glucose); push('a1c',S.a1c); push('weight',S.weight);
  push('bp',S.bp); push('meals',S.meals); push('water',S.water); push('activity',S.activity);
  push('shots',S.shots||[]); push('labs',S.labs||[]);
  return out.sort((a,b)=>b.r.ts-a.r.ts).slice(0,n);
}

function rowOf(item){
  const {k,r} = item;
  let icon='glucose', title='', sub=relDay(r.ts)+' • '+fmtTime(r.ts), val='', unit='', pill='';
  if(k==='glucose'){ const st=gStatus(r.mg,r.tag); icon='glucose'; title='سكر الدم — '+TAGS[r.tag].ar;
    val=fromMg(r.mg); unit=gUnit(); pill=`<span class="pill ${st.cls}">${st.ar}</span>`; }
  else if(k==='a1c'){ icon='a1c'; title='السكر التراكمي'; val=r1(r.value); unit='%';
    pill=`<span class="pill ${a1cStatus(r.value).cls}">${a1cStatus(r.value).ar}</span>`; }
  else if(k==='weight'){ icon='weight'; title='الوزن'; val=r1(r.value); unit='كجم'; }
  else if(k==='bp'){ const st=bpStatus(r.sys,r.dia); icon='bp'; title='ضغط الدم'; val=`${r.sys}/${r.dia}`; unit='mmHg';
    pill=`<span class="pill ${st.cls}">${st.ar}</span>`; }
  else if(k==='meals'){ icon='meal'; title=r.name; sub=`${MEAL_TYPES[r.type]} • ${relDay(r.ts)} ${fmtTime(r.ts)}`;
    val=r.cal; unit=`سعرة • ${r.carbs} كارب`; }
  else if(k==='water'){ icon='water'; title='مياه'; val=r.ml; unit='مل'; }
  else if(k==='activity'){ icon='run'; title=r.name||'نشاط'; val=r.min; unit='دقيقة'; }
  else if(k==='shots'){ icon='pill'; title='جرعة المونجارو'; sub=`${r.site||''} • ${relDay(r.ts)} ${fmtTime(r.ts)}`;
    val=r.dose; unit='مج'; }
  else if(k==='labs'){ const L=LABS[r.type]||{ar:r.type,unit:''}; const st=labStatus(r.type,r.value);
    icon='chart'; title=L.ar; val=r1(r.value); unit=L.unit; pill=`<span class="pill ${st.cls}">${st.ar}</span>`; }
  return `<div class="row" style="${tintOf(icon)}">
    <div class="ic">${svg(icon,1.9)}</div>
    <div class="tx"><b>${esc(title)}</b><small>${sub}</small>${pill?'<div style="margin-top:4px">'+pill+'</div>':''}</div>
    <div class="vl"><b class="num">${val}</b><small>${unit}</small></div>
  </div>`;
}

function emptyBox(t,p,btn){

  ['glucose','سكر الدم'],['a1c','التراكمي'],['shots','المونجارو'],['labs','التحاليل'],

];

function renderRecords(){

    <button onclick="exportPrint()">${svg('print',1.9)}</button></div></div>

  const arr = [...(S[recTab]||[])].sort((a,b)=>b.ts-a.ts);
  if(!arr.length){
    return topbar()+tabs+`<div class="section">${emptyBox('السجل فاضي','أول ما تسجّل حاجة هنا هتلاقيها مرتبة بالتاريخ مع إمكانية التعديل والحذف.',
      `<button class="btn sm" onclick="openLog('${recTab==='meals'?'meal':recTab}')">سجّل دلوقتي</button>`)}</div>`;

  /* تجميع حسب اليوم */
  const groups = {};

  let body = '';
  for(const k in groups){

    let head = relDay(list[0].ts);
    let extra = '';
    if(recTab==='meals'){
      const c=sum(list.map(m=>m.cal)), cb=sum(list.map(m=>m.carbs));
      extra = `<span style="color:var(--muted);font-weight:600">${c} سعرة • ${cb} كارب</span>`;
    }else if(recTab==='glucose'){
      const a = Math.round(avg(list.map(g=>g.mg)));
      extra = `<span style="color:var(--muted);font-weight:600">متوسط ${fromMg(a)}</span>`;
    }else if(recTab==='water'){
      extra = `<span style="color:var(--muted);font-weight:600">${sum(list.map(w=>w.ml))} مل</span>`;
    }
    body += `<div class="section" style="padding-top:16px">

function recRow(kind, r){

/* ==========================================================

function renderReports(){

  const mgs = gl.map(g=>g.mg);
  const inRange = gl.filter(g=>gStatus(g.mg,g.tag).k==='good').length;
  const lows = gl.filter(g=>g.mg < tagRange(g.tag)[0]).length;
  const highs = gl.length - inRange - lows;
  const est = mgs.length? avgToA1c(avg(mgs)) : null;
  const a1cLast = lastRec('a1c');

  const ranges = `<div class="tabs" style="padding-top:4px">
    ${[[7,'٧ أيام'],[30,'٣٠ يوم'],[90,'٣ شهور'],[365,'سنة']].map(([v,ar])=>
      `<button class="tab ${repRange===v?'on':''}" onclick="setRange(${v})">${ar}</button>`).join('')}</div>`;

  const stats = `<div class="section" style="padding-top:14px"><div class="stat-grid">

    <div class="stat"><small>الوقت في النطاق</small><b class="num">${gl.length? Math.round(inRange/gl.length*100):'—'}<u> %</u></b><u>${inRange} من ${gl.length}</u></div>
    <div class="stat"><small>تراكمي تقديري</small><b class="num">${est? r1(est):'—'}<u> %</u></b><u>محسوب من قراءاتك</u></div>

  </div></div>`;

  /* توزيع القراءات */
  const dist = gl.length ? `<div class="section">
    <div class="sec-head"><h2>توزيع القراءات</h2></div>
    <div class="card pad">
      <div style="display:flex;height:34px;border-radius:11px;overflow:hidden;background:var(--paper)">

        ${inRange?`<div class="bar-fill" style="width:${inRange/gl.length*100}%;background:var(--s-good)"></div>`:''}
        ${highs?`<div class="bar-fill" style="width:${highs/gl.length*100}%;background:var(--s-mid)"></div>`:''}
      </div>

        <span><i style="background:var(--s-low)"></i>تحت النطاق ${Math.round(lows/gl.length*100)}%</span>
        <span><i style="background:var(--s-good)"></i>في النطاق ${Math.round(inRange/gl.length*100)}%</span>
        <span><i style="background:var(--s-mid)"></i>فوق النطاق ${Math.round(highs/gl.length*100)}%</span>
      </div>
    </div></div>` : '';

  /* متوسط حسب وقت القياس */
  let byTag = '';
  if(gl.length){
    const rows = Object.keys(TAGS).map(t=>{
      const set = gl.filter(g=>g.tag===t);
      if(!set.length) return '';
      const m = avg(set.map(g=>g.mg));
      const st = gStatus(m,t);
      return `<div class="row"><div class="ic">${svg('glucose',1.9)}</div>
        <div class="tx"><b>${TAGS[t].ar}</b><small>${set.length} قراءة</small></div>
        <div class="vl"><b class="num" style="color:${st.col}">${fromMg(m)}</b><small>${gUnit()}</small></div></div>`;
    }).join('');
    if(rows) byTag = `<div class="section"><div class="sec-head"><h2>المتوسط حسب التوقيت</h2></div><div class="card">${rows}</div></div>`;
  }

  /* الرسوم */
  const gChart = gl.length>1 ? chartCard('منحنى السكر', lineChart(gl.map(g=>({ts:g.ts,v:fromMg(g.mg)})), {
      bands:[{from:fromMg(S.profile.targets.post[0]), to:fromMg(S.profile.targets.post[1]), col:'rgba(62,158,82,.13)'}],
      col:'var(--teal)', unit:gUnit()
    })) : '';
  const wArr = inDays('weight', n);
  const wChart = wArr.length>1 ? chartCard('منحنى الوزن', lineChart(wArr.map(w=>({ts:w.ts,v:w.value})), {col:'var(--ink)', unit:'كجم'})) : '';
  const aArr = inDays('a1c', 730);
  const aChart = aArr.length>1 ? chartCard('السكر التراكمي', lineChart(aArr.map(a=>({ts:a.ts,v:a.value})), {
      bands:[{from:0,to:S.profile.targets.a1c,col:'rgba(62,158,82,.13)'}], col:'var(--s-mid)', unit:'%'})) : '';

  /* السعرات آخر ٧ أيام */
  const days = [];
  for(let i=6;i>=0;i--){ const d = dayKey(Date.now()-i*864e5); days.push({d, cal:sum(ofDay('meals',d).map(m=>m.cal)), carb:sum(ofDay('meals',d).map(m=>m.carbs))}); }
  const anyCal = days.some(x=>x.cal>0);
  const calChart = anyCal ? `<div class="section"><div class="sec-head"><h2>السعرات — آخر ٧ أيام</h2></div>
    <div class="card pad"><div class="chart">${barChart(days.map(x=>({label:AR_DAYS[new Date(x.d+'T12:00').getDay()].slice(0,3), v:x.cal})), S.profile.targets.calories)}</div>
    <div class="legend"><span><i style="background:var(--s-mid)"></i>سعرات اليوم</span><span><i style="background:var(--line)"></i>هدفك ${S.profile.targets.calories}</span></div></div></div>` : '';

  const nothing = (!gl.length && !wArr.length && !anyCal) ?
    `<div class="section">${emptyBox('التقارير هتظهر هنا','سجّل قراءات لمدة كام يوم، والبرنامج هيحسب المتوسطات والمنحنيات والتراكمي التقديري لوحده.')}</div>` : '';

  const foot = `<div class="section"><div class="note">

    الأرقام دي متابعة شخصية مش تشخيص طبي. النطاقات المستهدفة بتختلف من شخص للتاني حسب حالتك وعلاجك — اظبطها من «حسابي ← الأهداف» بالاتفاق مع دكتورك.

    <div style="margin-top:12px"><button class="btn ghost" onclick="exportPrint()">${svg('print',2)} اطبع تقرير للدكتور</button></div>

function setRange(v){ repRange=v; render(); }

function chartCard(title, inner){
  return `<div class="section"><div class="sec-head"><h2>${title}</h2></div>
    <div class="card pad"><div class="chart">${inner}</div></div></div>`;
}

/* ---------- رسم بياني خطي ---------- */
function lineChart(pts, o={}){
  if(pts.length<2) return '';
  const W=560,H=230,PL=44,PR=12,PT=16,PB=30;
  const xs = pts.map(p=>p.ts), ys = pts.map(p=>p.v);
  let minY=Math.min(...ys), maxY=Math.max(...ys);
  (o.bands||[]).forEach(b=>{ minY=Math.min(minY,b.from); maxY=Math.max(maxY,b.to); });
  const padY=(maxY-minY)*0.18 || Math.max(1,maxY*0.1);
  minY=Math.max(0,minY-padY); maxY=maxY+padY;
  const minX=Math.min(...xs), maxX=Math.max(...xs);
  const X = t => PL + (maxX===minX?0.5:(t-minX)/(maxX-minX)) * (W-PL-PR);
  const Y = v => PT + (1-(v-minY)/(maxY-minY||1)) * (H-PT-PB);

  let g='';
  (o.bands||[]).forEach(b=>{ g += `<rect x="${PL}" y="${Y(b.to)}" width="${W-PL-PR}" height="${Math.max(0,Y(b.from)-Y(b.to))}" fill="${b.col}" rx="4"/>`; });
  for(let i=0;i<=3;i++){
    const v = minY + (maxY-minY)*i/3;
    g += `<line x1="${PL}" y1="${Y(v)}" x2="${W-PR}" y2="${Y(v)}" stroke="var(--line)" stroke-width="1"/>
          <text x="${PL-8}" y="${Y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="IBM Plex Sans Arabic">${Math.round(v*10)/10}</text>`;
  }
  const dPath = pts.map((p,i)=>`${i?'L':'M'}${X(p.ts).toFixed(1)},${Y(p.v).toFixed(1)}`).join(' ');
  const area = dPath + ` L${X(pts[pts.length-1].ts).toFixed(1)},${H-PB} L${X(pts[0].ts).toFixed(1)},${H-PB} Z`;
  g += `<path d="${area}" fill="${o.col||'var(--teal)'}" opacity=".08"/>`;
  const approxLen = Math.round(pts.reduce((L,p,i)=> i? L+Math.hypot(X(p.ts)-X(pts[i-1].ts), Y(p.v)-Y(pts[i-1].v)) : 0, 0)) + 40;
  g += `<path data-line d="${dPath}" fill="none" stroke="${o.col||'var(--teal)'}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" style="--len:${approxLen}"/>`;
  pts.forEach((p,i)=>{ g += `<circle cx="${X(p.ts).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="3" fill="var(--surface)" stroke="${o.col||'var(--teal)'}" stroke-width="2" style="animation-delay:${(0.25+i/pts.length*0.75).toFixed(2)}s;transform-box:fill-box;transform-origin:center"/>`; });
  [pts[0], pts[pts.length-1]].forEach((p,i)=>{
    g += `<text x="${X(p.ts)}" y="${H-8}" text-anchor="${i?'end':'start'}" font-size="11" fill="var(--muted)" font-family="IBM Plex Sans Arabic">${fmtDate(p.ts)}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">${g}</svg>`;
}

/* ---------- رسم أعمدة ---------- */
function barChart(items, target){
  const W=560,H=200,PL=10,PR=10,PT=14,PB=26;
  const max = Math.max(target||0, ...items.map(i=>i.v), 1)*1.12;
  const bw = (W-PL-PR)/items.length;
  const Y = v => PT + (1-v/max)*(H-PT-PB);
  let g = `<line x1="${PL}" y1="${Y(target)}" x2="${W-PR}" y2="${Y(target)}" stroke="var(--line)" stroke-width="2" stroke-dasharray="5 5"/>`;
  items.forEach((it,i)=>{
    const x = PL + i*bw + bw*0.22, w = bw*0.56;
    const h = Math.max(2,(H-PT-PB) - (Y(it.v)-PT));
    const col = it.v > target ? 'var(--s-mid)' : 'var(--teal)';
    g += `<rect data-bar x="${x}" y="${Y(it.v)}" width="${w}" height="${h}" rx="6" fill="${it.v?col:'var(--line)'}" style="animation-delay:${(i*0.055).toFixed(3)}s;transform-box:fill-box"/>`;
    g += `<text x="${x+w/2}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--muted)" font-family="IBM Plex Sans Arabic">${it.label}</text>`;
    if(it.v) g += `<text x="${x+w/2}" y="${Y(it.v)-5}" text-anchor="middle" font-size="10.5" fill="var(--ink)" font-family="IBM Plex Sans Arabic">${it.v}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">${g}</svg>`;
}
</script>
<script>
/* ==========================================================
   الأدوية والتذكيرات
   ========================================================== */
function medsDueToday(){
  const d = today(), out=[];
  (S.meds||[]).filter(m=>m.active!==false).forEach(m=>{
    (m.times||[]).forEach(t=>{
      const taken = (S.medLog||[]).some(l=>l.medId===m.id && l.slot===t && dayKey(l.ts)===d);
      out.push({med:m, time:t, taken});
    });
  });
  return out.sort((a,b)=>a.time.localeCompare(b.time));
}

function renderMeds(){
  const due = medsDueToday();
  const doneN = due.filter(d=>d.taken).length;

  const head = `<div class="section" style="padding-bottom:0"><div class="sec-head"><h2>الأدوية</h2>
    <button onclick="openMedForm()">+ ضيف دوا</button></div></div>`;

  const prog = due.length ? `<div class="section" style="padding-top:12px">
    <div class="card pad">
      <div style="display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px">
        <b style="font-family:Zain;font-size:18px">جرعات النهارده</b>
        <span class="num" style="font-family:Zain;font-size:22px;font-weight:800">${doneN}<span style="font-size:14px;color:var(--muted)"> / ${due.length}</span></span>
      </div>
      <div style="height:9px;border-radius:99px;background:var(--paper);overflow:hidden">
        <div class="bar-fill" style="height:100%;width:${due.length?doneN/due.length*100:0}%;background:linear-gradient(90deg,var(--c-pill),var(--teal));border-radius:99px"></div>
      </div>
    </div></div>` : '';

  const list = due.length ? `<div class="section"><div class="sec-head"><h2>مواعيد النهارده</h2></div>
    <div class="card">${due.map(d=>`
      <div class="row">
        <div class="ic" style="background:${d.taken?'var(--teal-l)':'var(--paper)'};color:${d.taken?'var(--teal-d)':'var(--ink-2)'}">${svg('pill',1.9)}</div>
        <div class="tx"><b>${esc(d.med.name)}</b><small>${esc(d.med.dose||'')} • الساعة ${d.time}</small></div>
        <button class="btn sm ${d.taken?'ghost':''}" style="${d.taken?'color:var(--teal-d)':''}" onclick="toggleMed('${d.med.id}','${d.time}')">
          ${d.taken?'اتاخد ✓':'خد الجرعة'}
        </button>
      </div>`).join('')}</div></div>` : '';

  const all = (S.meds||[]).length ? `<div class="section"><div class="sec-head"><h2>كل الأدوية</h2></div>
    <div class="card">${S.meds.map(m=>`
      <div class="row">
        <div class="ic">${svg('pill',1.9)}</div>
        <div class="tx"><b>${esc(m.name)}</b><small>${esc(m.dose||'—')} • ${(m.times||[]).join(' , ')||'من غير مواعيد'}</small></div>
        <button class="swipe-del" onclick="delMed('${m.id}')">${svg('trash',1.9)}</button>
        <button class="swipe-del" style="color:var(--muted)" onclick="openMedForm('${m.id}')">${svg('edit',1.9)}</button>
      </div>`).join('')}</div></div>`
    : `<div class="section">${emptyBox('مفيش أدوية مسجلة','ضيف أدويتك ومواعيدها، والبرنامج هيفكرك بيها كل يوم ويحسب التزامك.',
        '<button class="btn sm" onclick="openMedForm()">ضيف أول دوا</button>')}</div>`;

  /* الالتزام آخر ٧ أيام */
  let adh = '';
  if((S.meds||[]).length){
    const slots = S.meds.filter(m=>m.active!==false).reduce((n,m)=>n+(m.times||[]).length,0);
    if(slots){
      const days=[];
      for(let i=6;i>=0;i--){
        const d = dayKey(Date.now()-i*864e5);
        const c = (S.medLog||[]).filter(l=>dayKey(l.ts)===d).length;
        days.push({label:AR_DAYS[new Date(d+'T12:00').getDay()].slice(0,3), v:Math.min(c,slots)});
      }
      adh = `<div class="section"><div class="sec-head"><h2>الالتزام — آخر ٧ أيام</h2></div>
        <div class="card pad"><div class="chart">${barChart(days, slots)}</div></div></div>`;
    }
  }
  return topbar()+head+prog+list+adh+all;
}

function toggleMed(id, slot){
  const d = today();
  const ex = (S.medLog||[]).find(l=>l.medId===id && l.slot===slot && dayKey(l.ts)===d);
  if(ex){ S.medLog = S.medLog.filter(l=>l!==ex); }
  else { S.medLog.push({id:uid(), medId:id, slot, ts:Date.now()}); toast('تمام، اتسجلت'); }
  save(); render();
}
function delMed(id){
  if(!confirm('تمسح الدوا ده من القايمة؟')) return;
  S.meds = S.meds.filter(m=>m.id!==id);
  S.medLog = S.medLog.filter(l=>l.medId!==id);
  save(); render();
}

      </div></div>
