<script>
/* ==========================================================
   ديك الكروت المتداخلة — سحب باللمس بحركة spring
   ========================================================== */
let deckIdx = 0, deckN = 0;

function deckCards(){
  const out = [];
  const g = lastRec('glucose');
  const w = lastRec('weight');
  const m = (typeof mjInfo === 'function') ? mjInfo() : null;
  const a = lastRec('a1c');
  const bp = lastRec('bp');
  const labKeys = Object.keys(LABS).filter(k=>lastLab(k));

  /* ١ — سكر الدم */
  if(g){
    const st = gStatus(g.mg, g.tag);
    const [lo,hi] = tagRange(g.tag);
    out.push({ cc:'var(--c-glucose)', go:"go('reports')", body:`
      <div class="dc-top"><span class="dc-lbl">آخر قراءة سكر — ${TAGS[g.tag].ar}</span><span class="dc-go">›</span></div>
      <div class="dc-val"><b class="num" style="color:${st.col}">${fromMg(g.mg)}</b><span>${gUnit()}</span></div>
      <div class="dc-sub" style="color:${st.col}">${st.ar}</div>
      <div class="strip" style="margin:auto 0 6px"><div class="marker" id="marker" style="right:50%"></div></div>
      <div class="strip-ticks"><span class="num">${fromMg(lo-60)}</span><span>${relDay(g.ts)} • ${fmtTime(g.ts)}</span><span class="num">${fromMg(hi+70)}</span></div>
      <input type="hidden" id="markerPos" value="${st.pos}">` });
  }else{
    out.push({ cc:'var(--c-glucose)', go:"openLog('glucose')", body:`
      <div class="dc-top"><span class="dc-lbl">سكر الدم</span></div>
      <div class="dc-val"><b class="num" style="color:var(--muted)">—</b><span>${gUnit()}</span></div>
      <div class="dc-sub">مفيش قراءات لسه</div>
      <div style="margin-top:auto"><button class="btn sm" onclick="event.stopPropagation();openLog('glucose')">سجّل أول قراءة</button></div>` });
  }

  /* ٢ — المونجارو */
  if(m){
    const L = mjLabel();
    out.push({ cc:'var(--c-pill)', go:"go('assistant')", body:`
      <div class="dc-top"><span class="dc-lbl">المونجارو</span><span class="dc-go">›</span></div>
      <div class="dc-val"><b class="num" style="color:${L.col};font-size:${L.big.length>3?'34px':'52px'}">${L.big}</b>
        <span>${L.big.length>3?'':'يوم'}</span></div>
      <div class="dc-sub">${m.late?`فاتت ${Math.abs(m.daysLeft)} يوم — كلّم دكتورك`:(m.due||m.today?'موعد الجرعة النهارده':`للجرعة الجاية • ${m.last.dose} مج`)}</div>
      <div class="dc-foot">آخر جرعة ${m.last.dose} مج — ${relDay(m.last.ts)}</div>` });
  }

  /* ٣ — الوزن */
  if(w){
    const J = (typeof journeyStats==='function') ? journeyStats() : null;
    const bmi = bmiInfo(w.value);
    out.push({ cc:'var(--c-weight)', go:"go('journey')", body:`
      <div class="dc-top"><span class="dc-lbl">الوزن</span><span class="dc-go">›</span></div>
      <div class="dc-val"><b class="num" style="color:var(--c-weight)">${r1(w.value)}</b><span>كجم</span></div>
      <div class="dc-sub">${J && J.rate!==null ? `${J.rate<0?'نازل':'زايد'} ${Math.abs(J.rate)} كجم/أسبوع` : (bmi?bmi.ar:'')}</div>
      <div class="dc-foot">${J && J.goal ? `وصلت ${J.pct}% لهدفك — باقي ${J.left>0?J.left:0} كجم` : (bmi?`BMI ${bmi.v}`:relDay(w.ts))}</div>` });
  }

  /* ٤ — التراكمي */
  if(a){
    const st = a1cStatus(a.value);
    out.push({ cc:'var(--c-a1c)', go:"go('reports')", body:`
      <div class="dc-top"><span class="dc-lbl">السكر التراكمي</span><span class="dc-go">›</span></div>
      <div class="dc-val"><b class="num" style="color:var(--c-a1c)">${r1(a.value)}</b><span>%</span></div>
      <div class="dc-sub">${st.ar}</div>
      <div class="dc-foot">متوسط تقديري ${fromMg(a1cToAvg(a.value))} ${gUnit()} • ${fmtDate(a.ts)}</div>` });
  }

  /* ٥ — التحاليل */
  if(labKeys.length){
    const k = labKeys[0], l = lastLab(k), st = labStatus(k, l.value);
    out.push({ cc:'var(--c-run)', go:"go('assistant')", body:`
      <div class="dc-top"><span class="dc-lbl">${LABS[k].ar}</span><span class="dc-go">›</span></div>
      <div class="dc-val"><b class="num" style="color:var(--c-run)">${r1(l.value)}</b><span>${LABS[k].unit}</span></div>
      <div class="dc-sub">${st.ar}</div>
      <div class="dc-foot">${labKeys.length} تحليل مسجّل • آخرها ${fmtDate(l.ts)}</div>` });
  }

  /* ٦ — الضغط */
  if(bp){
    const st = bpStatus(bp.sys, bp.dia);
    out.push({ cc:'var(--c-bp)', go:"setTab('bp');go('records')", body:`
      <div class="dc-top"><span class="dc-lbl">ضغط الدم</span><span class="dc-go">›</span></div>
      <div class="dc-val"><b class="num" style="color:var(--c-bp);font-size:46px">${bp.sys}/${bp.dia}</b><span>mmHg</span></div>
      <div class="dc-sub">${st.ar}</div>
      <div class="dc-foot">${bp.pulse?`النبض ${bp.pulse} • `:''}${relDay(bp.ts)} ${fmtTime(bp.ts)}</div>` });
  }

  return out;
}

function deckHTML(){
  const cards = deckCards();
  deckN = cards.length;
  if(deckIdx >= deckN) deckIdx = 0;
  return `<div class="deck" id="deck">
    ${cards.map((c,i)=>`<div class="dcard" style="--cc:${c.cc}" data-i="${i}" onclick="deckTap(${i},&quot;${c.go.replace(/"/g,'&quot;')}&quot;)">
      <div class="dcard-in">${c.body}</div></div>`).join('')}
  </div>
  <div class="deck-dots" id="deckDots">${cards.map((c,i)=>`<i data-i="${i}" style="--dc:${c.cc}"></i>`).join('')}</div>`;
}

function layoutDeck(dx){
  const el = $('deck'); if(!el) return;
  const cards = [...el.querySelectorAll('.dcard')];
  const n = cards.length || 1;
  const prog = dx ? Math.min(1, Math.abs(dx)/130) : 0;
  cards.forEach(c=>{
    const i = +c.dataset.i;
    const d = (i - deckIdx + n) % n;
    if(d === 0){
      c.style.transform = `translate3d(${dx||0}px,0,0) rotate(${(dx||0)/34}deg)`;
      c.style.opacity = dx ? String(Math.max(.55, 1 - Math.abs(dx)/420)) : '1';
      c.style.zIndex = 30;
    }else if(d <= 3){
      const dd = Math.max(0, d - prog);
      c.style.transform = `translate3d(${-13*dd}px,${11*dd}px,0) scale(${(1 - .045*dd).toFixed(4)})`;
      c.style.opacity = '1';
      c.style.zIndex = String(30 - d);
    }else{
      c.style.transform = 'translate3d(-39px,33px,0) scale(.865)';
      c.style.opacity = '0';
      c.style.zIndex = '26';
    }
  });
  const dots = $('deckDots');
  if(dots) [...dots.children].forEach(x=>{
    const on = +x.dataset.i === deckIdx;
    x.classList.toggle('on', on);
    x.style.background = on ? x.style.getPropertyValue('--dc') : '';
  });
}

function deckGo(step){
  if(deckN < 2) return;
  deckIdx = (deckIdx + step + deckN) % deckN;
  layoutDeck(0);
  if(navigator.vibrate) try{ navigator.vibrate(9) }catch(e){}
  if(deckIdx === 0 && typeof placeMarker === 'function') requestAnimationFrame(placeMarker);
}

let _dk = null;
function deckTap(i, go){
  if(_dk && _dk.moved) return;                 /* كان بيسحب مش بيضغط */
  const n = deckN || 1;
  const d = (i - deckIdx + n) % n;
  if(d !== 0){ deckIdx = i; layoutDeck(0); return; }
  try{ eval(go); }catch(e){}
}

function initDeck(){
  const el = $('deck'); if(!el) return;
  layoutDeck(0);
  if(el._wired) return;
  el._wired = true;

  const start = x => { _dk = { x0:x, dx:0, moved:false };
    el.querySelectorAll('.dcard').forEach(c=>c.classList.add('dragging')); };
  const move = x => {
    if(!_dk) return;
    _dk.dx = x - _dk.x0;
    if(Math.abs(_dk.dx) > 6) _dk.moved = true;
    layoutDeck(_dk.dx);
  };
  const end = () => {
    if(!_dk) return;
    const dx = _dk.dx;
    el.querySelectorAll('.dcard').forEach(c=>c.classList.remove('dragging'));
    if(dx < -58) deckGo(1);
    else if(dx > 58) deckGo(-1);
    else layoutDeck(0);
    setTimeout(()=>{ _dk = null; }, 60);
  };

  if(window.PointerEvent){
    el.addEventListener('pointerdown', e=>{ if(e.button===0||e.pointerType!=='mouse'){ start(e.clientX); } });
    el.addEventListener('pointermove', e=>{ if(_dk){ move(e.clientX); } });
    el.addEventListener('pointerup', end);
    el.addEventListener('pointercancel', end);
    el.addEventListener('pointerleave', ()=>{ if(_dk) end(); });
  }else{
    el.addEventListener('touchstart', e=>start(e.touches[0].clientX), {passive:true});
    el.addEventListener('touchmove',  e=>move(e.touches[0].clientX),  {passive:true});
    el.addEventListener('touchend',   end);
  }
  document.addEventListener('keydown', e=>{
    if(view !== 'home') return;
    if(e.key === 'ArrowLeft')  deckGo(1);
    if(e.key === 'ArrowRight') deckGo(-1);
  });
}
</script>

<script>
/* ==========================================================
   المونجارو • التحاليل • التنبيهات الذكية • المساعد
   ========================================================== */

/* ---------- إعدادات حقن المونجارو ---------- */
const MJ_DOSES = [2.5, 5, 7.5, 10, 12.5, 15];
const MJ_SITES = ['البطن','الفخذ','أعلى الذراع'];
const mjInterval = ()=> S.profile.shotDays || 7;

function shotsSorted(){ return [...(S.shots||[])].sort((a,b)=>b.ts-a.ts); }
function mjInfo(){
  const arr = shotsSorted();
  if(!arr.length) return null;
  const last = arr[0];
  const days = mjInterval();
  const next = last.ts + days*864e5;
  const msLeft = next - Date.now();
  const daysLeft = Math.ceil(msLeft/864e5);
  const elapsed = Math.min(1, Math.max(0, (Date.now()-last.ts)/(days*864e5)));
  /* الالتزام: كام جرعة في آخر ٨ أسابيع مقابل المتوقع */
  const win = arr.filter(s=>s.ts >= Date.now()-56*864e5);
  const expected = Math.min(8, Math.floor((Date.now()-arr[arr.length-1].ts)/(days*864e5))+1);
  return {
    last, next, daysLeft, elapsed, count: arr.length,
    due: msLeft <= 0,
    today: dayKey(next) === today(),
    late: msLeft < -864e5,
    taken8: win.length, expected8: Math.max(1, expected),
    weeksOn: Math.round((Date.now()-arr[arr.length-1].ts)/(7*864e5)),
    firstTs: arr[arr.length-1].ts
  };
}
function mjLabel(){
  const m = mjInfo();
  if(!m) return { pct:0, big:'—', sub:'مفيش جرعات', col:'var(--c-pill)' };
  if(m.late)  return { pct:1, big:'متأخرة', sub:`فاتت ${Math.abs(m.daysLeft)} يوم`, col:'var(--s-high)' };
  if(m.due || m.today) return { pct:1, big:'النهارده', sub:'موعد الجرعة', col:'var(--s-mid)' };
  return { pct:m.elapsed, big:String(m.daysLeft), sub:`يوم للجرعة • ${m.last.dose} مج`, col:'var(--c-pill)' };
}

/* ---------- التحاليل ---------- */
const LABS = {
  chol: { ar:'الكوليسترول الكلي', unit:'mg/dL', good:[0,200],
          bands:[[0,200,'مرغوب','p-good'],[200,240,'حدّي','p-mid'],[240,1e9,'مرتفع','p-high']] },
  ldl:  { ar:'الكوليسترول الضار LDL', unit:'mg/dL', good:[0,100],
          bands:[[0,100,'مثالي','p-good'],[100,130,'قريب من المثالي','p-good'],[130,160,'حدّي','p-mid'],[160,190,'مرتفع','p-high'],[190,1e9,'مرتفع جداً','p-high']] },
  hdl:  { ar:'الكوليسترول النافع HDL', unit:'mg/dL', good:[40,200], higher:true,
          bands:[[0,40,'منخفض','p-high'],[40,60,'مقبول','p-mid'],[60,1e9,'وقائي','p-good']] },
  trig: { ar:'الدهون الثلاثية', unit:'mg/dL', good:[0,150],
          bands:[[0,150,'طبيعي','p-good'],[150,200,'حدّي','p-mid'],[200,500,'مرتفع','p-high'],[500,1e9,'مرتفع جداً','p-high']] },
  alt:  { ar:'إنزيم الكبد ALT', unit:'U/L', good:[7,56],
          bands:[[0,7,'منخفض','p-mid'],[7,56,'ضمن المعدل','p-good'],[56,1e9,'مرتفع','p-high']] },
  creat:{ ar:'الكرياتينين', unit:'mg/dL', good:[0.6,1.3],
          bands:[[0,0.6,'منخفض','p-mid'],[0.6,1.3,'ضمن المعدل','p-good'],[1.3,1e9,'مرتفع','p-high']] },
  vitd: { ar:'فيتامين د', unit:'ng/mL', good:[30,100], higher:true,
          bands:[[0,20,'نقص','p-high'],[20,30,'غير كافي','p-mid'],[30,100,'كافي','p-good'],[100,1e9,'مرتفع','p-mid']] },
  hb:   { ar:'الهيموجلوبين', unit:'g/dL', good:[12,17.5],
          bands:[[0,12,'منخفض','p-high'],[12,17.5,'ضمن المعدل','p-good'],[17.5,1e9,'مرتفع','p-mid']] }
};
function labStatus(type, v){
  const L = LABS[type]; if(!L) return {ar:'',cls:''};
  for(const [lo,hi,ar,cls] of L.bands) if(v >= lo && v < hi) return {ar,cls};
  return {ar:'',cls:''};
}
function lastLab(type){
  const a = (S.labs||[]).filter(l=>l.type===type).sort((x,y)=>y.ts-x.ts);
  return a.length ? a[0] : null;
}
function labTrend(type){
  const a = (S.labs||[]).filter(l=>l.type===type).sort((x,y)=>x.ts-y.ts);
  if(a.length < 2) return null;
  return r1(a[a.length-1].value - a[a.length-2].value);
}

/* ---------- التنبيهات الذكية ---------- */
function alerts(){
  const out = [];
  const push = (lvl, ic, title, body) => out.push({lvl, ic, title, body});

  /* المونجارو */
  const m = mjInfo();
  if(m){
    if(m.late) push('high','pill','جرعة المونجارو متأخرة',
      `آخر جرعة كانت ${relDay(m.last.ts)}. فات على الموعد ${Math.abs(m.daysLeft)} يوم — كلّم دكتورك قبل ما تاخدها متأخرة.`);
    else if(m.due || m.today) push('mid','pill','موعد جرعة المونجارو النهارده', `آخر جرعة ${m.last.dose} مج يوم ${fmtDate(m.last.ts)}.`);
    else if(m.daysLeft === 1) push('low','pill','جرعة المونجارو بكرة', `${m.last.dose} مج — نفس اليوم من كل أسبوع.`);
  }

  /* سكر منخفض أو مرتفع متكرر */
  const g7 = inDays('glucose',7);
  const lows = g7.filter(g=>g.mg < 70);
  if(lows.length >= 2) push('high','glucose','هبوط سكر متكرر',
    `${lows.length} قراءات تحت ٧٠ في آخر أسبوع. ده شيء يتعرض على دكتورك، خصوصاً لو معاك دوا بيخفّض السكر.`);
  const highs = g7.filter(g=>g.mg >= 250);
  if(highs.length >= 3) push('high','glucose','قراءات مرتفعة متكررة',
    `${highs.length} قراءات فوق ٢٥٠ في آخر أسبوع. سجّلها واعرضها على دكتورك.`);

  /* تحاليل متأخرة */
  const a1cLast = lastRec('a1c');
  if(!a1cLast) push('low','a1c','مسجّلتش تحليل تراكمي','التراكمي بيتعمل كل ٣ شهور تقريباً — سجّله هنا لما تعمله.');
  else if(Date.now() - a1cLast.ts > 100*864e5) push('mid','a1c','التراكمي بقاله فترة',
    `آخر تحليل من ${fmtDate(a1cLast.ts)}. المعتاد كل ٣ شهور — راجع دكتورك.`);

  const cholLast = lastLab('chol') || lastLab('ldl');
  if(!cholLast) push('low','chart','مفيش تحليل دهون مسجّل','سجّل الكوليسترول والدهون الثلاثية عشان نتابع اتجاههم.');
  else if(Date.now() - cholLast.ts > 200*864e5) push('mid','chart','تحاليل الدهون بقالها فترة',
    `آخرها من ${fmtDate(cholLast.ts)}.`);

  /* نزول سريع */
  const J = (typeof journeyStats === 'function') ? journeyStats() : null;
  if(J && J.rate !== null && J.rate < -1.2) push('mid','weight','النزول سريع',
    `${Math.abs(J.rate)} كجم في الأسبوع. المعتاد من نص لـ كيلو — اعرض الرقم ده على دكتورك، خصوصاً مع المونجارو.`);

  /* أكل قليل جداً */
  const cal7 = [];
  for(let i=0;i<7;i++){ const c = sum(ofDay('meals',dayKey(Date.now()-i*864e5)).map(x=>x.cal)); if(c>0) cal7.push(c); }
  if(cal7.length >= 3 && avg(cal7) < 1000) push('mid','meal','السعرات قليلة جداً',
    `متوسط ${Math.round(avg(cal7))} سعرة في اليوم من اللي سجّلته. لو ده فعلاً كل أكلك، اتكلم مع دكتورك — نقص الأكل الشديد بيأثر على العضل والفيتامينات.`);

  /* قراءة صيام ناقصة */
  if(!g7.some(g=>g.tag==='fasting')) push('low','glucose','مفيش قراءة صيام الأسبوع ده','قراءة الصبح من أهم الأرقام لدكتورك.');

  /* أدوية فايتة */
  const due = medsDueToday().filter(d=>!d.taken);
  if(due.length) push('low','pill','جرعات النهارده لسه',`${due.length} جرعة متسجّلتش لحد دلوقتي.`);

  const order = {high:0, mid:1, low:2};
  return out.sort((a,b)=>order[a.lvl]-order[b.lvl]);
}
function alertsCard(max){
  const list = alerts().slice(0, max||3);
  if(!list.length) return '';
  const bg = {high:'var(--c-bp-l)', mid:'var(--c-meal-l)', low:'var(--paper)'};
  const fg = {high:'var(--c-bp)', mid:'var(--c-meal)', low:'var(--muted)'};
  return `<div class="section">
    <div class="sec-head"><h2>تنبيهات</h2><button onclick="go('assistant')">المساعد ←</button></div>
    <div class="card">${list.map(a=>`
      <div class="insight" style="--tint:${bg[a.lvl]};--tone:${fg[a.lvl]}">
        <div class="ib" style="background:${bg[a.lvl]};color:${fg[a.lvl]}">${svg(a.ic,2)}</div>
        <p><b>${a.title}</b><br><span style="color:var(--muted)">${a.body}</span></p>
      </div>`).join('')}</div></div>`;
}

/* ==========================================================
   المساعد الذكي
   ========================================================== */
function renderAssistant(){
  const J = (typeof journeyStats==='function') ? journeyStats() : null;
  const m = mjInfo();
  const al = alerts();
  const g30 = inDays('glucose',30);
  const a1cL = lastRec('a1c');

  const head = `<div class="section" style="padding-bottom:0"><div class="sec-head">
    <h2>المساعد</h2><button onclick="go('meds')">الأدوية ←</button></div>
    <p class="hint" style="padding:0 4px">ملخّص مبني على أرقامك انت بس — مش تشخيص، ومش بديل عن دكتورك.</p></div>`;

  /* التنبيهات */
  const bg={high:'var(--c-bp-l)',mid:'var(--c-meal-l)',low:'var(--paper)'};
  const fg={high:'var(--c-bp)',mid:'var(--c-meal)',low:'var(--muted)'};
  const alertsBox = al.length ? `<div class="section" style="padding-top:14px">
    <div class="sec-head"><h2>محتاج انتباهك</h2></div>
    <div class="card">${al.map(a=>`<div class="insight">
      <div class="ib" style="background:${bg[a.lvl]};color:${fg[a.lvl]}">${svg(a.ic,2)}</div>
      <p><b>${a.title}</b><br><span style="color:var(--muted)">${a.body}</span></p></div>`).join('')}</div></div>`
    : `<div class="section" style="padding-top:14px"><div class="note">مفيش حاجة محتاجة انتباه دلوقتي. كمّل تسجيل عشان الملخّص يبقى أدق.</div></div>`;

  /* الوزن */
  let weightBox = '';
  if(J){
    const d90 = (()=>{ const a=inDays('weight',95); return a.length>1 ? r1(a[a.length-1].value-a[0].value) : null; })();
    weightBox = `<div class="section"><div class="sec-head"><h2>الوزن</h2><button onclick="go('journey')">التفاصيل ←</button></div>
      <div class="stat-grid">
        <div class="stat"><small>الحالي</small><b class="num">${r1(J.cur)}<u> كجم</u></b><u>من ${r1(J.start)} كجم</u></div>
        <div class="stat"><small>${J.lost>=0?'نزل':'زاد'} إجمالاً</small><b class="num">${Math.abs(J.lost)}<u> كجم</u></b>${J.goal?`<u>باقي ${J.left>0?J.left:0} كجم</u>`:'<u>حدّد هدفك</u>'}</div>
        <div class="stat"><small>آخر ٣ شهور</small><b class="num">${d90===null?'—':(d90>0?'+':'')+d90}<u> كجم</u></b><u>الفرق عن ٩٠ يوم</u></div>
        <div class="stat"><small>المعدل الأسبوعي</small><b class="num">${J.rate===null?'—':(J.rate>0?'+':'')+J.rate}<u> كجم</u></b><u>${J.rate!==null&&J.rate<-1.2?'أسرع من المعتاد':'من آخر ٢١ يوم'}</u></div>
      </div></div>`;
  }

  /* المونجارو */
  const mjBox = m ? `<div class="section"><div class="sec-head"><h2>المونجارو</h2></div>
      <div class="stat-grid">
        <div class="stat"><small>آخر جرعة</small><b class="num">${m.last.dose}<u> مج</u></b><u>${relDay(m.last.ts)}</u></div>
        <div class="stat"><small>الجرعة الجاية</small><b class="num" style="font-size:21px">${m.late?'متأخرة':(m.due||m.today?'النهارده':fmtDate(m.next))}</b><u>${m.late?`فاتت ${Math.abs(m.daysLeft)} يوم`:(m.daysLeft>0?`بعد ${m.daysLeft} يوم`:'')}</u></div>
        <div class="stat"><small>إجمالي الجرعات</small><b class="num">${m.count}</b><u>من ${fmtDate(m.firstTs)}</u></div>
        <div class="stat"><small>مدة العلاج</small><b class="num">${m.weeksOn}<u> أسبوع</u></b><u>من أول جرعة</u></div>
      </div>
      <p class="hint">تغيير الجرعة قرار دكتورك وحده — البرنامج بيسجّل بس اللي انت بتاخده.</p></div>`
    : `<div class="section"><div class="sec-head"><h2>المونجارو</h2></div>
      ${emptyBox('مفيش جرعات مسجّلة','سجّل جرعتك وهيعدّ لك تنازلي للجرعة الجاية ويفكّرك بيها.',
        `<button class="btn sm" onclick="openLog('shot')">سجّل جرعة</button>`)}</div>`;

  /* التحاليل */
  const labKeys = Object.keys(LABS).filter(k=>lastLab(k));
  const labsBox = labKeys.length ? `<div class="section"><div class="sec-head"><h2>التحاليل</h2>
      <button onclick="openLog('lab')">+ سجّل</button></div>
    <div class="card">${labKeys.map(k=>{
      const l = lastLab(k), st = labStatus(k, l.value), tr = labTrend(k);
      const arrow = tr===null?'':(tr>0?`▲ ${Math.abs(tr)}`:(tr<0?`▼ ${Math.abs(tr)}`:'='));
      const good = LABS[k].higher ? (tr>0) : (tr<0);
      return `<div class="row" style="--tint:var(--c-a1c-l);--tone:var(--c-a1c)">
        <div class="ic">${svg('chart',1.9)}</div>
        <div class="tx"><b>${LABS[k].ar}</b><small>${fmtDate(l.ts)}${arrow?` • <span style="color:${tr===0?'var(--muted)':(good?'var(--s-good)':'var(--s-mid)')}">${arrow}</span> عن السابق`:''}</small>
          <div style="margin-top:4px"><span class="pill ${st.cls}">${st.ar}</span></div></div>
        <div class="vl"><b class="num">${r1(l.value)}</b><small>${LABS[k].unit}</small></div></div>`;
    }).join('')}</div>
    <p class="hint">النطاقات دي عامة وبتختلف من معمل لمعمل وحسب حالتك — الحكم النهائي لدكتورك.</p></div>`
   : `<div class="section"><div class="sec-head"><h2>التحاليل</h2></div>
      ${emptyBox('مفيش تحاليل','سجّل الكوليسترول والدهون الثلاثية ووظائف الكبد والكلى، والبرنامج هيتابع اتجاههم.',
        `<button class="btn sm" onclick="openLog('lab')">سجّل تحليل</button>`)}</div>`;

  /* السكر */
  const sugarBox = g30.length ? `<div class="section"><div class="sec-head"><h2>السكر — ٣٠ يوم</h2><button onclick="go('reports')">التقارير ←</button></div>
    <div class="stat-grid">
      <div class="stat"><small>المتوسط</small><b class="num">${fromMg(avg(g30.map(g=>g.mg)))}<u> ${gUnit()}</u></b><u>${g30.length} قراءة</u></div>
      <div class="stat"><small>في النطاق</small><b class="num">${Math.round(g30.filter(g=>gStatus(g.mg,g.tag).k==='good').length/g30.length*100)}<u> %</u></b><u>من قراءاتك</u></div>
      <div class="stat"><small>التراكمي المسجّل</small><b class="num">${a1cL?r1(a1cL.value):'—'}<u> %</u></b><u>${a1cL?fmtDate(a1cL.ts):'مسجلتش'}</u></div>
      <div class="stat"><small>تراكمي تقديري</small><b class="num">${r1(avgToA1c(avg(g30.map(g=>g.mg))))}<u> %</u></b><u>من قراءاتك</u></div>
    </div></div>` : '';

  /* الملاحظات */
  const ins = (typeof insights==='function') ? insightsCard() : '';

  return topbar()+head+alertsBox+weightBox+mjBox+labsBox+sugarBox+ins+`<div style="height:8px"></div>`;
}

/* ---------- فورم جرعة المونجارو ---------- */
function formShot(){
  const last = shotsSorted()[0];
  F.dose = last ? last.dose : 2.5;
  F.site = last ? (last.site || MJ_SITES[0]) : MJ_SITES[0];
  openSheet('جرعة المونجارو', `
    <div class="field"><label>الجرعة (مج)</label>
      <div class="chips" id="mjd">${MJ_DOSES.map(d=>
        `<button class="chip ${d===F.dose?'on':''}" data-d="${d}" onclick="pickDose(this)">${d}</button>`).join('')}</div></div>
    <div class="field"><label>مكان الحقن</label>
      <div class="chips" id="mjs">${MJ_SITES.map(x=>
        `<button class="chip ${x===F.site?'on':''}" data-s="${x}" onclick="pickSite(this)">${x}</button>`).join('')}</div></div>
    <div class="field"><label>التاريخ والوقت</label><input class="input" id="mjts" type="datetime-local" value="${nowInput()}"></div>
    <div class="field"><label>ملاحظة (اختياري)</label><input class="input" id="mjn" placeholder="أعراض، غثيان، أي حاجة"></div>
    <div class="field"><label>كل كام يوم؟</label><input class="input num" id="mjint" type="number" value="${mjInterval()}"></div>
    <button class="btn" onclick="saveShot()">احفظ الجرعة</button>
    <p class="hint">البرنامج هيعد تنازلي للجرعة الجاية ويفكّرك. الجرعة ومواعيدها بيحددهم دكتورك.</p>`);
}
function pickDose(b){ [...$('mjd').children].forEach(c=>c.classList.remove('on')); b.classList.add('on'); F.dose=+b.dataset.d; }
function pickSite(b){ [...$('mjs').children].forEach(c=>c.classList.remove('on')); b.classList.add('on'); F.site=b.dataset.s; }
function saveShot(){
  const iv = +$('mjint').value || 7;
  S.profile.shotDays = iv; S.profU = Date.now();
  S.shots = S.shots || [];
  S.shots.push({ id:uid(), ts:new Date($('mjts').value).getTime()||Date.now(),
                 dose:F.dose, site:F.site, note:($('mjn').value||'').trim() });
  save(); closeSheet(); render(); toast('اتسجلت الجرعة');
}

/* ---------- فورم التحاليل ---------- */
function formLab(){
  F.lab = 'chol';
  openSheet('تحليل جديد', `
    <div class="field"><label>نوع التحليل</label>
      <div class="chips" id="lbt">${Object.keys(LABS).map(k=>
        `<button class="chip ${k==='chol'?'on':''}" data-k="${k}" onclick="pickLab(this)">${LABS[k].ar}</button>`).join('')}</div></div>
    <input class="big-input num" id="lbv" type="number" step="0.1" inputmode="decimal" placeholder="0">
    <p class="hint" style="text-align:center;margin:8px 0 18px" id="lbu">${LABS.chol.unit}</p>
    <div class="field"><label>تاريخ التحليل</label><input class="input" id="lbts" type="datetime-local" value="${nowInput()}"></div>
    <div id="lbpre"></div>
    <button class="btn" onclick="saveLab()">احفظ التحليل</button>`);
  $('lbv').addEventListener('input', previewLab);
}
function pickLab(b){
  [...$('lbt').children].forEach(c=>c.classList.remove('on'));
  b.classList.add('on'); F.lab=b.dataset.k;
  $('lbu').textContent = LABS[F.lab].unit;
  previewLab();
}
function previewLab(){
  const v = parseFloat($('lbv').value), box = $('lbpre');
  if(!v){ box.innerHTML=''; return; }
  const st = labStatus(F.lab, v);
  box.innerHTML = `<div class="note" style="margin-bottom:14px"><b style="font-family:Zain;font-size:16px">${st.ar}</b><br>
    النطاق المرجعي العام لـ«${LABS[F.lab].ar}»: ${LABS[F.lab].good[0]}–${LABS[F.lab].good[1]} ${LABS[F.lab].unit}. بيختلف حسب المعمل وحالتك.</div>`;
}
function saveLab(){
  const v = parseFloat($('lbv').value);
  if(!v){ toast('اكتب النتيجة الأول'); return; }
  S.labs = S.labs || [];
  S.labs.push({ id:uid(), ts:new Date($('lbts').value).getTime()||Date.now(), type:F.lab, value:v });
  save(); closeSheet(); render(); toast('اتسجل التحليل');
}
</script>

<script>
/* ==========================================================
   طبقة التزامن — حساب واحد، كل الأجهزة
   ========================================================== */
const SYNC_KINDS = ['glucose','a1c','weight','bp','meals','water','activity','meds','medLog','shots','labs'];
const K_TOKEN='mylife.token', K_USER='mylife.uname', K_SINCE='mylife.since', K_PUSHED='mylife.pushed';
const OVERLAP = 15000;          /* هامش أمان لفروق ساعة الأجهزة */

let TOKEN='', UNAME='', SINCE=0, PUSHED=0;
let SYNC_STATE='', syncing=false, syncTimer=null, authMode='login';
let shadow={};

const ls = { get:k=>{ try{return localStorage.getItem(k)||''}catch(e){return ''} },
             set:(k,v)=>{ try{localStorage.setItem(k,v)}catch(e){} },
             del:k=>{ try{localStorage.removeItem(k)}catch(e){} } };

function loadMeta(){
  TOKEN = ls.get(K_TOKEN); UNAME = ls.get(K_USER);
  SINCE = +ls.get(K_SINCE) || 0; PUSHED = +ls.get(K_PUSHED) || 0;
}
function saveMeta(){ ls.set(K_SINCE, String(SINCE)); ls.set(K_PUSHED, String(PUSHED)); }

/* ---------- ختم التغييرات (يمسك الإضافة والحذف تلقائياً) ---------- */
function snapshotShadow(){
  shadow = {};
  SYNC_KINDS.forEach(k=>{ shadow[k] = new Set((S[k]||[]).map(r=>r.id)); });
}
function stampChanges(){
  const now = Date.now();
  if(!S.tombs) S.tombs = [];
  SYNC_KINDS.forEach(k=>{
    const arr = S[k] = S[k] || [];
    const cur = new Set();
    arr.forEach(r=>{
      if(!r.id) r.id = uid();
      cur.add(r.id);
      if(!r.u) r.u = now;                                  /* جديد أو قديم من غير ختم */
      else if(shadow[k] && !shadow[k].has(r.id)) r.u = r.u; /* موجود بختمه */
    });
    if(shadow[k]) shadow[k].forEach(id=>{
      if(!cur.has(id)) S.tombs.push({ kind:k, rid:id, u:now }); /* اتحذف */
    });
  });
  snapshotShadow();
}
/* لتعديل ريكورد قايم — يخليه يتزامن */
function touch(kind, id){
  const r = (S[kind]||[]).find(x=>x.id===id);
  if(r) r.u = Date.now();
}

/* ---------- الاتصال ---------- */
async function api(path, body, method){
  const r = await fetch(path, {
    method: method || 'POST',
    headers: Object.assign({'content-type':'application/json'}, TOKEN?{authorization:'Bearer '+TOKEN}:{}),
    body: JSON.stringify(body||{})
  });
  let d = {}; try{ d = await r.json(); }catch(e){}
  if(!r.ok){ const e = new Error(d.error || 'فيه مشكلة في الاتصال'); e.status = r.status; throw e; }
  return d;
}

/* ---------- المؤشر ---------- */
function setSync(st){
  SYNC_STATE = st;
  document.querySelectorAll('.sync-dot').forEach(d=>{ d.className = 'sync-dot ' + st; });
}
const sheetBusy = ()=> ['sheet','lock','auth'].some(id=>{ const e=$(id); return e && e.classList.contains('on'); });

/* ---------- تجميع المعلّق ---------- */
function profForSync(){
  const p = Object.assign({}, S.profile);
  delete p.pin; delete p.notify; delete p.theme;   /* دي إعدادات جهاز، مش بيانات حساب */
  return p;
}
function collectPending(){
  const recs = [];
  SYNC_KINDS.forEach(k=>(S[k]||[]).forEach(r=>{
    if((r.u||0) > PUSHED) recs.push({ kind:k, rid:r.id, u:r.u, data:r });
  }));
  (S.tombs||[]).forEach(t=>recs.push({ kind:t.kind, rid:t.rid, u:t.u, del:true, data:null }));
  const prof = (S.profU||0) > PUSHED ? { u:S.profU, data:profForSync() } : null;
  return { recs, prof };
}

/* ---------- الدمج (الأحدث يفوز) ---------- */
function mergeIn(resp){
  let changed = false;
  (resp.recs||[]).forEach(r=>{
    if(SYNC_KINDS.indexOf(r.kind) < 0) return;
    const arr = S[r.kind] = S[r.kind] || [];
    const i = arr.findIndex(x=>x.id === r.rid);
    if(r.del){
      if(i >= 0 && (arr[i].u||0) <= r.u){ arr.splice(i,1); changed = true; }
      return;
    }
    if(!r.data) return;
    const inc = Object.assign({}, r.data, { id:r.rid, u:r.u });
    if(i < 0){ arr.push(inc); changed = true; }
    else if((arr[i].u||0) < r.u){ arr[i] = inc; changed = true; }
  });
  if(resp.prof && resp.prof.u > (S.profU||0) && resp.prof.data){
    const keep = { pin:S.profile.pin, notify:S.profile.notify, theme:S.profile.theme };
    S.profile = Object.assign(blank().profile, resp.prof.data, keep);
    S.profile.targets = Object.assign(blank().profile.targets, resp.prof.data.targets||{});
    S.profU = resp.prof.u;
    changed = true;
  }
  return changed;
}

/* ---------- التزامن ---------- */
function scheduleSync(){
  clearTimeout(syncTimer);
  syncTimer = setTimeout(()=>syncNow(), 900);
}
async function syncNow(manual){
  if(!TOKEN){ if(manual) toast('سجّل دخول الأول'); return; }
  if(syncing) return;
  if(!navigator.onLine){ setSync('off'); if(manual) toast('مفيش نت — التغييرات محفوظة وهتترفع لوحدها'); return; }
  syncing = true; setSync('sync');
  try{
    const p = collectPending();
    const r = await api('/api/sync', { since:SINCE, recs:p.recs, prof:p.prof });
    let maxU = PUSHED;
    p.recs.forEach(x=>{ if(x.u > maxU) maxU = x.u; });
    if(p.prof && p.prof.u > maxU) maxU = p.prof.u;
    PUSHED = maxU;
    S.tombs = [];
    const changed = mergeIn(r);
    SINCE = Math.max(0, (r.now || Date.now()) - OVERLAP);
    saveMeta(); snapshotShadow(); Store.save(S);
    setSync('ok');
    if(manual) toast('اتزامن ✓');
    if(changed && !sheetBusy()) render();
  }catch(e){
    if(e.status === 401){ setSync('off'); doLogout(true); toast('الجلسة انتهت — سجّل دخول تاني'); }
    else { setSync('off'); if(manual) toast(e.message); }
  }
  syncing = false;
}

/* ---------- شاشة الحساب ---------- */
function showAuth(){
  const al = $('authLogo'); if(al && !al.innerHTML) al.innerHTML = logoLockup(52);
  $('auth').classList.add('on');
  authMode = 'login'; paintAuth(); loadAuthConfig();
}
function paintAuth(){
  const reg = authMode === 'register';
  $('authTitle').textContent = reg ? 'حساب جديد' : 'تسجيل الدخول';
  $('authSub').textContent = reg
    ? 'اختار اسم وكلمة سر — دي اللي هتدخل بيها من أي جهاز'
    : 'دخول بحسابك علشان بياناتك تتزامن على كل أجهزتك';
  $('auGo').textContent = reg ? 'اعمل الحساب' : 'دخول';
  $('auSwitchTx').textContent = reg ? 'عندك حساب بالفعل؟' : 'معندكش حساب؟';
  $('auSwitchBtn').textContent = reg ? 'سجّل دخول' : 'اعمل حساب جديد';
  $('auPass').setAttribute('autocomplete', reg ? 'new-password' : 'current-password');
  $('auCodeWrap').style.display = (reg && NEED_CODE) ? '' : 'none';
  $('authErr').innerHTML = '';
}
function toggleAuthMode(){ authMode = authMode === 'login' ? 'register' : 'login'; paintAuth(); }
let NEED_CODE = false;
async function loadAuthConfig(){
  try{ const c = await api('/api/config', {}); NEED_CODE = !!c.needCode; paintAuth(); }catch(e){}
}
function authErr(m){ $('authErr').innerHTML = `<div class="auth-err">${esc(m)}</div>`; }

async function doAuth(){
  const uname = ($('auUser').value||'').trim().toLowerCase();
  const pass  = $('auPass').value||'';
  if(!uname || !pass){ authErr('اكتب اسم المستخدم وكلمة السر'); return; }
  const btn = $('auGo'); btn.disabled = true; btn.textContent = 'لحظة...';
  try{
    const payload = { uname, pass };
    if(authMode === 'register' && NEED_CODE) payload.code = ($('auCode').value||'').trim();
    const d = await api(authMode === 'register' ? '/api/register' : '/api/login', payload);
    TOKEN = d.token; UNAME = d.uname;
    ls.set(K_TOKEN, TOKEN); ls.set(K_USER, UNAME);
    SINCE = 0; PUSHED = 0; saveMeta();
    $('auth').classList.remove('on');
    $('auUser').value = ''; $('auPass').value = '';
    stampChanges();               /* أي بيانات لوكال موجودة تترفع */
    render();
    await syncNow();
    startSyncLoop();
    toast('أهلاً ' + UNAME);
  }catch(e){ authErr(e.message); }
  btn.disabled = false; paintAuth();
}
function doLogout(silent){
  if(!silent && !confirm('تسجّل خروج؟ البيانات المحفوظة على الجهاز ده هتتشال، وهترجع تاني أول ما تدخل.')) return;
  if(TOKEN && !silent) api('/api/logout', {}).catch(()=>{});
  TOKEN=''; UNAME=''; SINCE=0; PUSHED=0;
  ls.del(K_TOKEN); ls.del(K_USER); ls.del(K_SINCE); ls.del(K_PUSHED);
  S = blank(); Store.save(S); snapshotShadow();
  clearInterval(window.__syncLoop);
  view='home'; render(); showAuth();
}
function startSyncLoop(){
  clearInterval(window.__syncLoop);
  window.__syncLoop = setInterval(()=>syncNow(), 15000);
}

/* أحداث تستدعي تزامن */
addEventListener('online', ()=>{ setSync('sync'); syncNow(); });
addEventListener('offline', ()=>setSync('off'));
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) syncNow(); });
</script>

<script>
/* ==========================================================
   تصدير • استيراد • طباعة
   ========================================================== */
function exportJSON(){
  const blob = new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `mylife-backup-${today()}.json`;
  a.click(); URL.revokeObjectURL(a.href);
  toast('اتنزّلت النسخة');
}
function importJSON(){
  const inp = document.createElement('input');
  inp.type='file'; inp.accept='.json,application/json';
  inp.onchange = e=>{
    const f = e.target.files[0]; if(!f) return;
    const rd = new FileReader();
    rd.onload = ()=>{
      try{
        const d = JSON.parse(rd.result);
        if(!d.profile) throw 0;
        if(!confirm('ده هيستبدل البيانات الحالية بالنسخة دي. تكمل؟')) return;
        S = Object.assign(blank(), d);
        save(); render(); toast('البيانات رجعت');
      }catch(err){ toast('الملف مش مقروء'); }
    };
    rd.readAsText(f);
  };
  inp.click();
}

function exportPrint(){
  const n=90, gl=inDays('glucose',n);
  const mgs=gl.map(g=>g.mg);
  const inR=gl.filter(g=>gStatus(g.mg,g.tag).k==='good').length;
  const est=mgs.length? r1(avgToA1c(avg(mgs))):'—';
  const a=lastRec('a1c'), w=lastRec('weight'), b=lastRec('bp');
  const bmi=w?bmiInfo(w.value):null;
  const age=new Date().getFullYear()-(S.profile.birthYear||0);

  const tagRows = Object.keys(TAGS).map(t=>{
    const set=gl.filter(g=>g.tag===t); if(!set.length) return '';
    return `<tr><td>${TAGS[t].ar}</td><td>${set.length}</td><td>${fromMg(avg(set.map(g=>g.mg)))}</td>
      <td>${fromMg(Math.min(...set.map(g=>g.mg)))}</td><td>${fromMg(Math.max(...set.map(g=>g.mg)))}</td></tr>`;
  }).join('');

  const last20 = [...gl].sort((x,y)=>y.ts-x.ts).slice(0,25).map(g=>
    `<tr><td>${fmtFull(g.ts)}</td><td>${fmtTime(g.ts)}</td><td>${TAGS[g.tag].ar}</td><td><b>${fromMg(g.mg)}</b></td></tr>`).join('');

  const meds = (S.meds||[]).map(m=>`<tr><td>${esc(m.name)}</td><td>${esc(m.dose||'—')}</td><td>${(m.times||[]).join(' , ')}</td></tr>`).join('');

  const html = `<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
  <title>تقرير My Life — ${esc(S.profile.name||'')}</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body{font-family:"IBM Plex Sans Arabic",sans-serif;color:#12202B;margin:32px;font-size:13px;line-height:1.7}
    h1{font-size:23px;margin:0 0 4px}h2{font-size:16px;margin:26px 0 8px;padding-bottom:5px;border-bottom:2px solid #0E7C7B}
    .head{border-bottom:3px solid #0E2A33;padding-bottom:12px;margin-bottom:8px}
    .meta{color:#6C8189;font-size:12px}
    table{width:100%;border-collapse:collapse;margin-top:6px}
    th,td{border:1px solid #DDE5E4;padding:7px 9px;text-align:right}
    th{background:#EEF2F1;font-weight:600}
    .kpis{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
    .k{border:1px solid #DDE5E4;border-radius:10px;padding:10px 14px;min-width:130px}
    .k small{display:block;color:#6C8189;font-size:11px}.k b{font-size:20px}
    .foot{margin-top:28px;font-size:11px;color:#6C8189;border-top:1px solid #DDE5E4;padding-top:10px}
  </style></head><body>
  <div class="head"><h1>تقرير متابعة صحية</h1>
    <div class="meta">${esc(S.profile.name||'—')} • ${age>0&&age<120?age+' سنة • ':''}${S.profile.gender==='male'?'ذكر':'أنثى'} • تاريخ التقرير: ${fmtFull(Date.now())}</div></div>

  <h2>ملخص آخر ٩٠ يوم</h2>
  <div class="kpis">
    <div class="k"><small>متوسط السكر</small><b>${mgs.length?fromMg(avg(mgs)):'—'}</b> ${gUnit()}</div>
    <div class="k"><small>عدد القراءات</small><b>${gl.length}</b></div>
    <div class="k"><small>الوقت في النطاق</small><b>${gl.length?Math.round(inR/gl.length*100):'—'}%</b></div>
    <div class="k"><small>تراكمي تقديري</small><b>${est}</b> %</div>
    <div class="k"><small>آخر تحليل تراكمي</small><b>${a?r1(a.value):'—'}</b> % ${a?'('+fmtDate(a.ts)+')':''}</div>
    <div class="k"><small>الوزن</small><b>${w?r1(w.value):'—'}</b> كجم ${bmi?'(BMI '+bmi.v+')':''}</div>
    <div class="k"><small>آخر ضغط</small><b>${b?b.sys+'/'+b.dia:'—'}</b></div>
  </div>

  <h2>المتوسط حسب توقيت القياس</h2>
  <table><tr><th>التوقيت</th><th>عدد</th><th>المتوسط</th><th>الأقل</th><th>الأعلى</th></tr>${tagRows||'<tr><td colspan="5">مفيش قراءات</td></tr>'}</table>

  <h2>الأدوية الحالية</h2>
  <table><tr><th>الدوا</th><th>الجرعة</th><th>المواعيد</th></tr>${meds||'<tr><td colspan="3">مفيش</td></tr>'}</table>

  <h2>آخر ٢٥ قراءة سكر</h2>
  <table><tr><th>التاريخ</th><th>الوقت</th><th>التوقيت</th><th>القراءة (${gUnit()})</th></tr>${last20||'<tr><td colspan="4">مفيش قراءات</td></tr>'}</table>

  <div class="foot">النطاقات المستهدفة المستخدمة في التقرير: صيام ${S.profile.targets.fasting.join('–')} • بعد الأكل ${S.profile.targets.post.join('–')} mg/dL.
  التقرير ده متابعة ذاتية من تطبيق «My Life» وليس تشخيصاً طبياً.</div>
  <script>window.onload=()=>setTimeout(()=>window.print(),600)<\/script>
  </body></html>`;

  const wnd = window.open('', '_blank');
  if(!wnd){ toast('اسمح بفتح النوافذ عشان الطباعة'); return; }
  wnd.document.write(html); wnd.document.close();
}

/* ==========================================================
   التشغيل
   ========================================================== */
$('fab').onclick = openQuick;
$('scrim').onclick = closeSheet;

/* سحب الشيت لتحت للإغلاق */
(function(){
  const sh=$('sheet'); let y0=null;
  sh.addEventListener('touchstart',e=>{ if($('sheetBody').scrollTop<=0) y0=e.touches[0].clientY; },{passive:true});
  sh.addEventListener('touchmove',e=>{
    if(y0===null) return;
    const dy=e.touches[0].clientY-y0;
    if(dy>0) sh.style.transform=`translateY(${dy}px)`;
  },{passive:true});
  sh.addEventListener('touchend',e=>{
    if(y0===null) return;
    const dy=(e.changedTouches[0].clientY-y0);
    sh.style.transform='';
    if(dy>110) closeSheet();
    y0=null;
  });
})();

document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeSheet(); });

(async function init(){
  const d = await Store.load();
  if(d){ S = Object.assign(blank(), d); S.profile = Object.assign(blank().profile, d.profile||{});
         S.profile.targets = Object.assign(blank().profile.targets, (d.profile||{}).targets||{}); }
  loadMeta();
  applyTheme();
  snapshotShadow();
  if(!TOKEN){ render(); showAuth(); return; }
  setSync('');
  render();
  if(lockNeeded()) showLock('ask');
  checkReminders();
  syncNow();
  startSyncLoop();
  if(TOKEN && !S.profile.name){
    setTimeout(()=>openSheet('أهلاً بيك في My Life', `
      <p style="margin:0 0 16px;font-size:14.5px;line-height:1.75">My Life بيتابع معاك سكر الدم والتراكمي والوزن والأكل والأدوية، وبيحوّلهم لتقرير تقدر تعرضه على دكتورك. كل بياناتك متسجلة على جهازك بس.</p>
      <div class="field"><label>اسمك</label><input class="input" id="onName" placeholder="اكتب اسمك"></div>
      <div class="grid2">
        <div class="field"><label>الطول (سم)</label><input class="input num" id="onH" type="number" placeholder="170"></div>
        <div class="field"><label>سنة الميلاد</label><input class="input num" id="onY" type="number" placeholder="1990"></div>
      </div>
      <button class="btn" onclick="finishOnboard()">يلا نبدأ</button>
      <p class="hint">تقدر تغيّر أي حاجة بعدين من «حسابي».</p>`), 400);
  }
})();

function finishOnboard(){
  S.profile.name = $('onName').value.trim() || 'صاحب الحساب';
  S.profile.height = +$('onH').value || 170;
  S.profile.birthYear = +$('onY').value || 1990;
  save(); closeSheet(); render(); toast('أهلاً بيك 👋');
}
