<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0E3B45">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="My Life">
<title>My Life — متابعة صحتك اليومية</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zain:wght@400;700;800;900&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0E2A33;
  --deep:#0E2A33;
  --ink-2:#1B3F49;
  --on-deep:#FFFFFF;
  --paper:#EEF2F1;
  --surface:#FFFFFF;
  --line:#DDE5E4;
  --muted:#6C8189;
  --teal:#0E7C7B;
  --teal-d:#0A5C5B;
  --teal-l:#E3F2F1;
  /* مقياس شريط التحليل */
  --s-low:#2B7FB8;
  --s-good:#3E9E52;
  --s-mid:#E4A11B;
  --s-high:#C0392B;
  --r-s:10px; --r-m:16px; --r-l:22px; --r-xl:28px;
  --sp:16px;
  --shadow:0 1px 2px rgba(14,42,51,.05), 0 8px 24px -12px rgba(14,42,51,.18);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:"IBM Plex Sans Arabic",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  background:var(--paper); color:var(--ink);
  font-size:15px; line-height:1.6;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
h1,h2,h3,h4,.display,.num{font-family:"Zain","IBM Plex Sans Arabic",sans-serif;font-weight:800;letter-spacing:0}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:var(--teal);text-decoration:none}
::-webkit-scrollbar{width:0;height:0}

#app{max-width:520px;margin:0 auto;min-height:100vh;min-height:100dvh;background:var(--paper);position:relative;padding-bottom:96px}
@media(min-width:560px){
  body{background:#DCE4E3}
  #app{box-shadow:0 0 60px rgba(14,42,51,.12);min-height:100dvh}
}

/* ============ الهيدر ============ */
.topbar{
  position:sticky;top:0;z-index:40;
  background:var(--deep);color:var(--on-deep);
  padding:calc(env(safe-area-inset-top) + 14px) 18px 16px;
  border-radius:0 0 var(--r-xl) var(--r-xl);
}
.topbar-row{display:flex;align-items:center;gap:12px}
.avatar{
  width:44px;height:44px;border-radius:14px;flex:none;
  background:linear-gradient(145deg,var(--teal),#12A19F);
  display:grid;place-items:center;font-family:"Zain";font-size:20px;font-weight:800;color:#fff;
}
.hello{flex:1;min-width:0}
.hello small{display:block;color:#8FB0B6;font-size:12px;line-height:1.3}
.hello strong{display:block;font-family:"Zain";font-size:21px;font-weight:700;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{
  width:40px;height:40px;border-radius:12px;flex:none;
  background:rgba(255,255,255,.09);display:grid;place-items:center;color:#fff;
  transition:background .18s;
}
.icon-btn:active{background:rgba(255,255,255,.2)}
.icon-btn svg{width:20px;height:20px}

/* ============ الشريط — العنصر المميز ============ */
.strip-card{
  margin:-14px 14px 0;background:var(--surface);border-radius:var(--r-l);
  padding:18px 18px 14px;box-shadow:var(--shadow);position:relative;z-index:41;
}
.strip-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:2px}
.strip-label{font-size:12.5px;color:var(--muted);font-weight:600}
.strip-tag{
  font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:99px;
  background:var(--teal-l);color:var(--teal-d);
}
.strip-value{display:flex;align-items:baseline;gap:8px;margin:2px 0 4px}
.strip-value b{font-family:"Zain";font-size:52px;font-weight:900;line-height:1;letter-spacing:-1px}
.strip-value span{font-size:13px;color:var(--muted);font-weight:600}
.strip-meta{font-size:12.5px;color:var(--muted);margin-bottom:14px}

.strip{position:relative;height:14px;border-radius:99px;overflow:visible;margin-bottom:8px;
  background:linear-gradient(90deg,var(--s-high) 0%,var(--s-mid) 22%,var(--s-good) 44%,var(--s-good) 62%,var(--s-mid) 80%,var(--s-high) 100%);
}
.strip-ticks{display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.marker{
  position:absolute;top:-5px;width:8px;height:24px;border-radius:99px;
  background:var(--ink);border:3px solid var(--surface);box-shadow:0 2px 6px rgba(0,0,0,.35);
  transform:translateX(50%);transition:right .8s cubic-bezier(.2,.9,.25,1);
}
.strip-empty{
  height:14px;border-radius:99px;background:repeating-linear-gradient(45deg,#E7EDEC,#E7EDEC 6px,#F2F6F5 6px,#F2F6F5 12px);
}

/* ============ الحلقات ============ */
.rings{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:14px 14px 0}
.ring-card{background:var(--surface);border-radius:var(--r-m);padding:12px 8px;text-align:center;box-shadow:var(--shadow)}
.ring{position:relative;width:62px;height:62px;margin:0 auto 6px}
.ring svg{transform:rotate(-90deg)}
.ring .rv{position:absolute;inset:0;display:grid;place-items:center;font-family:"Zain";font-size:17px;font-weight:800}
.ring-card small{display:block;font-size:11.5px;color:var(--muted);font-weight:600}
.ring-card b{display:block;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:1px}

/* ============ الأقسام ============ */
.section{padding:22px 14px 0}
.sec-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;padding:0 4px}
.sec-head h2{font-size:19px;margin:0;font-weight:700}
.sec-head button{font-size:12.5px;color:var(--teal);font-weight:600}

.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.q{
  background:var(--surface);border-radius:var(--r-m);padding:12px 4px 10px;text-align:center;
  box-shadow:var(--shadow);transition:transform .12s;
}
.q:active{transform:scale(.94)}
.q i{display:block;width:34px;height:34px;margin:0 auto 6px;border-radius:11px;display:grid;place-items:center;background:var(--teal-l)}
.q i svg{width:19px;height:19px;color:var(--teal-d)}
.q span{font-size:11.5px;font-weight:600;display:block;line-height:1.3}

/* ============ الكروت والقوايم ============ */
.card{background:var(--surface);border-radius:var(--r-m);box-shadow:var(--shadow);overflow:hidden}
.card+.card{margin-top:10px}
.pad{padding:16px}
.row{display:flex;align-items:center;gap:12px;padding:13px 16px}
.row+.row{border-top:1px solid var(--line)}
.row .ic{width:38px;height:38px;border-radius:12px;flex:none;display:grid;place-items:center;background:var(--paper)}
.row .ic svg{width:18px;height:18px;color:var(--ink-2)}
.row .tx{flex:1;min-width:0}
.row .tx b{display:block;font-size:14.5px;font-weight:600;line-height:1.35}
.row .tx small{display:block;font-size:12px;color:var(--muted)}
.row .vl{text-align:left;flex:none}
.row .vl b{font-family:"Zain";font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.row .vl small{font-size:11px;color:var(--muted);display:block}

.dot{width:9px;height:9px;border-radius:99px;flex:none}
.pill{font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;display:inline-block}
.p-low{background:#E4F0F8;color:var(--s-low)}
.p-good{background:#E4F3E7;color:#2E7D3B}
.p-mid{background:#FBF0DA;color:#9A6B08}
.p-high{background:#F9E3E1;color:var(--s-high)}

.empty{text-align:center;padding:34px 20px;color:var(--muted)}
.empty svg{width:42px;height:42px;opacity:.35;margin-bottom:10px}
.empty b{display:block;font-family:"Zain";font-size:18px;color:var(--ink);margin-bottom:4px;font-weight:700}
.empty p{margin:0 0 14px;font-size:13px}

/* ============ الأزرار ============ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  background:var(--teal);color:#fff;font-weight:700;font-size:15px;
  padding:14px 20px;border-radius:14px;width:100%;transition:transform .12s,background .18s;
}
.btn:active{transform:scale(.97);background:var(--teal-d)}
.btn.ghost{background:var(--paper);color:var(--ink)}
.btn.dark{background:var(--deep);color:var(--on-deep)}
.btn.danger{background:#F9E3E1;color:var(--s-high)}
.btn.sm{padding:10px 14px;font-size:13.5px;width:auto;border-radius:11px}

/* ============ الفورمات ============ */
.field{margin-bottom:14px}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:6px}
.input,select.input,textarea.input{
  width:100%;background:var(--paper);border:1.5px solid transparent;border-radius:13px;
  padding:13px 14px;font-size:15px;outline:none;transition:border-color .18s,background .18s;
}
.input:focus{border-color:var(--teal);background:#fff}
textarea.input{resize:none;min-height:74px}
select.input{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236C8189' stroke-width='2.5' stroke-linecap='round'><path d='M6 9l6 6 6-6'/></svg>");background-repeat:no-repeat;background-position:left 14px center;background-size:16px}
.big-input{
  font-family:"Zain";font-size:44px;font-weight:900;text-align:center;
  background:var(--paper);border:none;border-radius:16px;padding:18px 10px;width:100%;outline:none;
  font-variant-numeric:tabular-nums;
}
.big-input:focus{background:var(--teal-l)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{
  padding:9px 14px;border-radius:12px;background:var(--paper);font-size:13px;font-weight:600;
  border:1.5px solid transparent;transition:.15s;
}
.chip.on{background:var(--deep);color:var(--on-deep);border-color:var(--deep)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hint{font-size:12px;color:var(--muted);line-height:1.55;margin:8px 0 0}

/* ============ الشيت ============ */
.scrim{position:fixed;inset:0;background:rgba(14,42,51,.5);opacity:0;pointer-events:none;transition:opacity .25s;z-index:90;backdrop-filter:blur(2px)}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:91;max-width:520px;margin:0 auto;
  background:var(--surface);border-radius:var(--r-xl) var(--r-xl) 0 0;
  transform:translateY(101%);transition:transform .32s cubic-bezier(.25,.9,.3,1);
  max-height:92dvh;display:flex;flex-direction:column;
}
.sheet.on{transform:translateY(0)}
.sheet-head{padding:16px 18px 12px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);flex:none}
.sheet-head h3{flex:1;margin:0;font-size:20px;font-weight:700}
.sheet-body{padding:18px;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:calc(env(safe-area-inset-bottom) + 22px)}
.grab{width:38px;height:4px;border-radius:99px;background:var(--line);margin:8px auto 0}

/* ============ النافيجيشن ============ */
.nav{
  position:fixed;bottom:0;left:0;right:0;z-index:60;max-width:520px;margin:0 auto;
  background:rgba(255,255,255,.94);backdrop-filter:blur(14px);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(5,1fr);
  padding:8px 6px calc(env(safe-area-inset-bottom) + 8px);
}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);padding:6px 0;position:relative}
.nav button svg{width:22px;height:22px}
.nav button span{font-size:10.5px;font-weight:600}
.nav button.on{color:var(--teal-d)}
.nav button.on::before{content:"";position:absolute;top:-8px;width:26px;height:3px;border-radius:99px;background:var(--teal)}

.fab{
  position:fixed;bottom:calc(env(safe-area-inset-bottom) + 76px);left:50%;transform:translateX(-50%);
  z-index:59;background:var(--deep);color:var(--on-deep);border-radius:99px;padding:13px 22px;
  display:flex;align-items:center;gap:8px;font-weight:700;font-size:14.5px;
  box-shadow:0 10px 26px -8px rgba(14,42,51,.55);transition:transform .15s;
}
.fab:active{transform:translateX(-50%) scale(.94)}
.fab svg{width:19px;height:19px}
@media(min-width:560px){.fab{left:auto;right:calc(50% - 260px + 16px);transform:none}.fab:active{transform:scale(.94)}}

/* ============ التبويبات ============ */
.tabs{display:flex;gap:7px;overflow-x:auto;padding:0 14px 2px;margin-bottom:2px}
.tab{padding:8px 14px;border-radius:11px;background:var(--surface);font-size:13px;font-weight:600;white-space:nowrap;flex:none;box-shadow:var(--shadow)}
.tab.on{background:var(--deep);color:var(--on-deep)}

/* ============ الشارت ============ */
.chart-wrap{padding:8px 4px 0}
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);padding:8px 6px 0}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-left:5px;vertical-align:-1px}

.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--surface);border-radius:var(--r-m);padding:14px;box-shadow:var(--shadow)}
.stat small{display:block;font-size:11.5px;color:var(--muted);font-weight:600;margin-bottom:2px}
.stat b{font-family:"Zain";font-size:27px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.15;display:block}
.stat u{text-decoration:none;font-size:11.5px;color:var(--muted)}

.toast{
  position:fixed;bottom:calc(env(safe-area-inset-bottom) + 140px);left:50%;transform:translate(-50%,14px);
  background:var(--deep);color:var(--on-deep);padding:12px 20px;border-radius:14px;font-size:13.5px;font-weight:600;
  z-index:120;opacity:0;pointer-events:none;transition:.25s;white-space:nowrap;max-width:88vw;
}
.toast.on{opacity:1;transform:translate(-50%,0)}

.alert{background:#F9E3E1;border-radius:14px;padding:13px 15px;font-size:13px;line-height:1.6;color:#8B2A20;margin-bottom:14px}
.alert b{display:block;font-family:"Zain";font-size:16px;margin-bottom:3px}
.note{background:var(--teal-l);border-radius:14px;padding:13px 15px;font-size:12.5px;line-height:1.65;color:var(--teal-d)}

.swipe-del{margin-right:auto;color:var(--s-high);padding:6px;opacity:.55}
.swipe-del svg{width:17px;height:17px}

.fade{animation:fade .45s cubic-bezier(.2,.8,.3,1) both}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}


/* ============ الوضع الليلي ============ */
:root[data-theme="dark"]{
  --ink:#E4EDEB;
  --deep:#123339;
  --on-deep:#FFFFFF;
  --ink-2:#BCD2CF;
  --paper:#091519;
  --surface:#101F24;
  --line:#22383E;
  --muted:#8AA3A8;
  --teal:#25A9A4;
  --teal-d:#7FD9D3;
  --teal-l:#123338;
  --s-low:#5AB0E0;
  --s-good:#4CBD65;
  --s-mid:#EEB13C;
  --s-high:#F0655B;
  --shadow:0 1px 2px rgba(0,0,0,.35), 0 10px 26px -14px rgba(0,0,0,.7);
}
:root[data-theme="dark"] body{background:var(--paper)}
:root[data-theme="dark"] .p-low{background:#12313F;color:#7CC6EC}
:root[data-theme="dark"] .p-good{background:#12321D;color:#74D188}
:root[data-theme="dark"] .p-mid{background:#332711;color:#F2C061}
:root[data-theme="dark"] .p-high{background:#3A1A17;color:#F5837A}
:root[data-theme="dark"] .nav{background:rgba(16,31,36,.92)}
:root[data-theme="dark"] .alert{background:#3A1A17;color:#F5A79F}
:root[data-theme="dark"] .strip-empty{background:repeating-linear-gradient(45deg,#16272C,#16272C 6px,#1B2E34 6px,#1B2E34 12px)}
:root[data-theme="dark"] select.input{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%238AA3A8' stroke-width='2.5' stroke-linecap='round'><path d='M6 9l6 6 6-6'/></svg>")}
:root[data-theme="dark"] .icon-btn{background:rgba(255,255,255,.1)}
@media(min-width:560px){:root[data-theme="dark"] body{background:#050D10}}

/* ============ حركات التنقل ============ */
@keyframes slideNext{from{opacity:0;transform:translateX(-22px)}to{opacity:1;transform:none}}
@keyframes slidePrev{from{opacity:0;transform:translateX(22px)}to{opacity:1;transform:none}}
#screen.anim-next{animation:slideNext .34s cubic-bezier(.22,.92,.28,1) both}
#screen.anim-prev{animation:slidePrev .34s cubic-bezier(.22,.92,.28,1) both}
.nav button.on svg{animation:pop .38s cubic-bezier(.3,1.45,.5,1)}
@keyframes pop{0%{transform:scale(.78)}58%{transform:scale(1.18)}100%{transform:scale(1)}}
.nav button.on::before{animation:grow .3s cubic-bezier(.2,1.3,.4,1) both}
@keyframes grow{from{width:0;opacity:0}to{width:26px;opacity:1}}
.rings .ring-card:nth-child(2){animation-delay:.06s}
.rings .ring-card:nth-child(3){animation-delay:.12s}
.quick .q{animation:fade .4s cubic-bezier(.2,.8,.3,1) both}
.quick .q:nth-child(2){animation-delay:.03s}.quick .q:nth-child(3){animation-delay:.06s}
.quick .q:nth-child(4){animation-delay:.09s}.quick .q:nth-child(5){animation-delay:.12s}
.quick .q:nth-child(6){animation-delay:.15s}.quick .q:nth-child(7){animation-delay:.18s}
.quick .q:nth-child(8){animation-delay:.21s}
.row{transition:background .16s}
.card .row:active{background:var(--paper)}

/* ============ الرؤى والسلسلة ============ */
.streak{
  margin:14px 14px 0;background:var(--deep);color:var(--on-deep);border-radius:var(--r-m);
  padding:14px 16px;display:flex;align-items:center;gap:14px;box-shadow:var(--shadow);
}
.streak .fl{width:42px;height:42px;border-radius:13px;background:rgba(255,255,255,.12);display:grid;place-items:center;flex:none}
.streak .fl svg{width:21px;height:21px;color:#FFB86B}
.streak b{font-family:"Zain";font-size:23px;font-weight:800;line-height:1.1;display:block}
.streak small{font-size:12px;opacity:.72;display:block}
.streak .days{display:flex;gap:5px;margin-right:auto;flex:none}
.streak .days i{width:9px;height:22px;border-radius:99px;background:rgba(255,255,255,.16)}
.streak .days i.hit{background:#7FD9D3}

.insight{display:flex;gap:12px;padding:13px 16px;align-items:flex-start}
.insight+.insight{border-top:1px solid var(--line)}
.insight .ib{width:32px;height:32px;border-radius:10px;flex:none;display:grid;place-items:center;background:var(--teal-l);color:var(--teal-d)}
.insight .ib svg{width:16px;height:16px}
.insight p{margin:0;font-size:13.5px;line-height:1.6}
.insight p b{font-weight:700}

/* ============ قفل الكود ============ */
.lock{
  position:fixed;inset:0;z-index:200;background:var(--paper);
  display:none;flex-direction:column;align-items:center;justify-content:center;padding:30px;
}
.lock.on{display:flex}
.lock h2{font-size:26px;margin:0 0 4px}
.lock p{color:var(--muted);font-size:13.5px;margin:0 0 26px}
.dots{display:flex;gap:14px;margin-bottom:30px}
.dots i{width:14px;height:14px;border-radius:99px;border:2px solid var(--line);transition:.2s}
.dots i.f{background:var(--teal);border-color:var(--teal);transform:scale(1.12)}
.keys{display:grid;grid-template-columns:repeat(3,72px);gap:14px}
.keys button{
  height:64px;border-radius:20px;background:var(--surface);box-shadow:var(--shadow);
  font-family:"Zain";font-size:26px;font-weight:800;transition:transform .1s;
}
.keys button:active{transform:scale(.9);background:var(--teal-l)}
.keys button.wide{font-size:14px;font-family:"IBM Plex Sans Arabic";font-weight:600;background:transparent;box-shadow:none;color:var(--muted)}
.shake{animation:shake .4s}

<script>

   ملف واحد • بدون أي مكتبات خارجية • يشتغل أوفلاين
   ========================================================== */

/* ---------- الأيقونات ---------- */
const I = {

    try{ if(window.storage){ const r = await window.storage.get(KEY); if(r && r.value) return JSON.parse(r.value); } }catch(e){}

    return null;
  },
  async save(d){
    const s = JSON.stringify(d);

/* ---------- أدوات ---------- */
const pad = n=>String(n).padStart(2,'0');
const dayKey = ts=>{const d=new Date(ts);return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`};
const today  = ()=>dayKey(Date.now());
const AR_MONTHS=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];

function fmtTime(ts){const d=new Date(ts);let h=d.getHours();const m=pad(d.getMinutes());const ap=h<12?'ص':'م';h=h%12||12;return `${h}:${m} ${ap}`}
function fmtDate(ts){const d=new Date(ts);return `${d.getDate()} ${AR_MONTHS[d.getMonth()]}`}
function fmtFull(ts){const d=new Date(ts);return `${AR_DAYS[d.getDay()]} ${d.getDate()} ${AR_MONTHS[d.getMonth()]}`}
function relDay(ts){
  const k=dayKey(ts);
  if(k===today()) return 'النهارده';
  if(k===dayKey(Date.now()-864e5)) return 'إمبارح';

const toMg   = v => S.profile.unit==='mmol' ? v*18 : v;

const gUnit  = ()=> S.profile.unit==='mmol' ? 'mmol/L' : 'mg/dL';

/* أوقات قياس السكر */
const TAGS = {
  fasting:{ ar:'صايم', range:[80,130] },
  pre:    { ar:'قبل الأكل', range:[80,130] },
  post:   { ar:'بعد الأكل بساعتين', range:[80,180] },
  random: { ar:'عشوائي', range:[80,180] },
  bed:    { ar:'قبل النوم', range:[90,150] },
  night:  { ar:'أثناء الليل', range:[80,140] }
};

/* تقييم قراءة السكر (بالـ mg/dL) */
function tagRange(tag){
  const T = S.profile.targets;
  if(tag==='fasting'||tag==='pre') return T.fasting;
  if(tag==='bed') return [90,150];
  return T.post;
}
function gStatus(mg, tag){
  const [lo,hi] = tagRange(tag);
  if(mg < 54)  return {k:'low',  cls:'p-low',  col:'var(--s-low)',  ar:'هبوط شديد', pos:0.04};
  if(mg < lo)  return {k:'low',  cls:'p-low',  col:'var(--s-low)',  ar:'أقل من المستهدف', pos:0.16};
  if(mg <= hi) return {k:'good', cls:'p-good', col:'var(--s-good)', ar:'في النطاق المستهدف', pos:0.5};
  if(mg <= hi+70) return {k:'mid', cls:'p-mid', col:'var(--s-mid)', ar:'أعلى من المستهدف', pos:0.82};
  return {k:'high', cls:'p-high', col:'var(--s-high)', ar:'مرتفع', pos:0.95};
}

/* ضغط الدم */
function bpStatus(sys,dia){
  if(sys<90||dia<60) return {cls:'p-low', ar:'منخفض'};
  if(sys<120&&dia<80) return {cls:'p-good', ar:'طبيعي'};
  if(sys<130&&dia<80) return {cls:'p-good', ar:'مقبول'};
  if(sys<140||dia<90) return {cls:'p-mid', ar:'مرتفع قليلاً'};
  if(sys<180&&dia<120) return {cls:'p-high', ar:'مرتفع'};
  return {cls:'p-high', ar:'مرتفع جداً'};
}

/* مؤشر كتلة الجسم */
function bmiInfo(kg){
  const h = S.profile.height/100; if(!h||!kg) return null;
  const v = kg/(h*h);
  let ar='طبيعي', cls='p-good';
  if(v<18.5){ar='أقل من الطبيعي';cls='p-mid'}
  else if(v<25){ar='وزن طبيعي';cls='p-good'}
  else if(v<30){ar='زيادة في الوزن';cls='p-mid'}
  else {ar='سِمنة';cls='p-high'}
  return {v:r1(v), ar, cls};
}

/* السكر التراكمي → متوسط تقديري */
const a1cToAvg = a => 28.7*a - 46.7;
const avgToA1c = m => (m + 46.7)/28.7;
function a1cStatus(v){
  if(v < 5.7) return {cls:'p-good', ar:'ضمن الطبيعي'};
  if(v < 6.5) return {cls:'p-mid',  ar:'حدّي'};
  if(v <= S.profile.targets.a1c) return {cls:'p-good', ar:'ضمن هدفك'};
  if(v < 8)   return {cls:'p-mid',  ar:'أعلى من هدفك'};
  return {cls:'p-high', ar:'مرتفع'};
}

/* السعرات المقدَّرة للحفاظ على الوزن */
function maintenanceCals(){
  const w = lastVal('weight'); const h = S.profile.height;
  const age = new Date().getFullYear() - (S.profile.birthYear||1990);
  if(!w||!h) return null;
  const bmr = S.profile.gender==='male' ? 10*w + 6.25*h - 5*age + 5 : 10*w + 6.25*h - 5*age - 161;
  return Math.round(bmr*1.4);
}

/* آخر قيمة */
function lastRec(k){ const a=S[k]; return a && a.length ? [...a].sort((x,y)=>y.ts-x.ts)[0] : null }
function lastVal(k){ const r=lastRec(k); return r ? r.value : null }
function ofDay(k, day){ return (S[k]||[]).filter(r=>dayKey(r.ts)===day) }
function inDays(k, n){ const t=Date.now()-n*864e5; return (S[k]||[]).filter(r=>r.ts>=t).sort((a,b)=>a.ts-b.ts) }

/* ---------- قاعدة بيانات الأكل المصري ---------- */
/* [الاسم, الوحدة, سعرات, كارب جم, بروتين جم] */
const FOODS = [
